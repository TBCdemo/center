                        <div className="flex flex-col sm:flex-row gap-3">
                            <RadioCard name="show_name" checked={v.show_name === false} onChange={() => set('show_name', false)} title="匿名" hint="貼文顯示「一位需要禱告的朋友」" />
                            <RadioCard name="show_name" checked={v.show_name === true} onChange={() => set('show_name', true)} title="顯示姓名" hint="貼文顯示姓名" />
                        </div>
                    </fieldset>

                    <InlineError message={error} />

                    <div className="grid grid-cols-2 gap-3 pt-2">
                        <button type="button" onClick={onCancel} className={btnCancelWhite}><XMarkIcon size={16} />取消</button>
                        <button type="submit" disabled={busy || !ready} className={btnSubmitDark}><SendIcon size={16} />{busy ? '送出中…' : submitLabel}</button>
                    </div>
                </form>
            );
        };

        const EMPTY_FORM = { content: '', category: '', is_public: true, show_name: true };
        const DRAFT_KEY = 'tbc_prayer_draft';
        const loadDraft = () => {
            try {
                const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
                if (!d || typeof d !== 'object') return EMPTY_FORM;
                return {
                    content: typeof d.content === 'string' ? d.content.slice(0, 800) : '',
                    category: SUBMIT_CATEGORIES.some(c => c.id === d.category) ? d.category : '',
                    is_public: d.is_public !== false, show_name: d.show_name !== false,
                };
            } catch (e) { return EMPTY_FORM; }
        };
        const clearDraft = () => { try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* 略過 */ } };

        const SubmitView = ({ session, onLogin, goMine, goHome, notify }) => {
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState('');
            if (!session) return <PageShell back={<BackButton onClick={goHome} label="返回禱告牆" />}><NeedLogin onLogin={onLogin} /></PageShell>;

            const handle = async (values) => {
                setBusy(true); setError('');
                try {
                    await api.submit(values);
                    clearDraft();
                    notify('已送出，審查通過後才會公開。');
                    goMine();
                } catch (err) { setError(err.message || '送出失敗，稍後再試'); }
                finally { setBusy(false); }
            };
            return (
                <PageShell back={<BackButton onClick={goHome} label="返回禱告牆" />}>
                    <h2 className="text-2xl font-semibold text-zinc-900 mb-1">新增貼文</h2>
                    <p className="text-sm text-zinc-500 mb-6">審查通過後顯示於禱告牆；若通知退回，修正後可以再次送審，請耐心等候。</p>
                    <PostForm initial={loadDraft()} draftKey={DRAFT_KEY} submitLabel="送出" busy={busy} error={error} onSubmit={handle} onCancel={goHome} />
                </PageShell>
            );
        };

        // ==========================================
        // 審查紀錄
        // ==========================================
        const HistoryList = ({ postId }) => {
            const [logs, setLogs] = useState(null);
            const [error, setError] = useState('');
            useEffect(() => {
                let alive = true;
                api.logsOfPost(postId).then(d => alive && setLogs(d)).catch(() => alive && setError('無法載入審查紀錄'));
                return () => { alive = false; };
            }, [postId]);
            if (error) return <p className="text-sm text-red-600">{error}</p>;
            if (!logs) return <p className="text-sm text-zinc-400 animate-pulse">載入中</p>;
            return (
                <ol className="flex flex-col gap-3 border-l-2 border-zinc-100 pl-4">
                    {logs.map(l => (
                        <li key={l.id} className="text-sm">
                            <div className="flex flex-wrap items-baseline gap-x-2 text-zinc-800">
                                <span className="font-medium">{ACTION_LABEL[l.action] || l.action}</span>
                                <span className="text-zinc-500">{l.actor_name}</span>
                                <span className="text-xs text-zinc-400 tabular-nums">{formatDateTime(l.created_at)}</span>
                            </div>
                            {l.reason && <p className="text-zinc-600 mt-0.5 whitespace-pre-line">{l.reason.replace(/公開設定/g, '誰可以看到貼文')}</p>}
                        </li>
                    ))}
                </ol>
            );
        };

        // 「查看審查紀錄」：貼文審核與我的禱告共用同一個樣式
        const HistoryToggle = ({ postId }) => {
            const [show, setShow] = useState(false);
            return (
                <div className="pt-3">
                    <button type="button" onClick={() => setShow(v => !v)} className={`text-sm font-medium text-zinc-500 hover:text-zinc-900 rounded px-1 -ml-1 transition-colors duration-150 ${focusRing}`}>{show ? '收合審查紀錄' : '查看審查紀錄'}</button>
                    {show && <div className="mt-3"><HistoryList postId={postId} /></div>}
                </div>
            );
        };

        // ==========================================
        // 我的禱告：卡片格式同「貼文審核」
        // ==========================================
        const MyPostCard = ({ post, reason, showStatus, goEdit, forceReason, canSeeHistory }) => {
            const returned = post.review_status === 'returned';
            const name = post.show_name ? post.author_name : ANON_NAME;
            return (
                <li className="bg-white rounded-lg border border-zinc-200 shadow-sm p-4 sm:p-5">
                    <div className="flex items-center justify-between gap-3 mb-2.5">
                        <div className="flex items-center gap-3 min-w-0">
                            <CategoryAvatar id={post.category} />
                            <span className="text-[15px] font-medium text-zinc-900 truncate min-w-0">{name}</span>
                        </div>
                        {returned && <button type="button" onClick={() => goEdit(post.id)} className={`${btnGhost} shrink-0`}><PencilIcon size={16} />重新送審</button>}
                    </div>
                    <ClampText text={post.content} />
                    {(returned || forceReason) && (
                        <div className="bg-red-50 border border-red-100 rounded-lg p-3 mt-3">
                            <p className="text-xs font-medium text-red-700 mb-1">退回原因</p>
                            <p className="text-sm text-red-900 whitespace-pre-line">{reason?.reason || '—'}</p>
                        </div>
                    )}
                    <div className="flex flex-wrap items-center gap-x-5 gap-y-2 mt-3 text-zinc-500">
                        {showStatus && <StatusLabel status={post.review_status} />}
                        {post.review_status === 'approved' && <UpdatesButton postId={post.id} alwaysEnabled onClick={() => go(`#/post/${post.id}`)} />}
                        <span className="inline-flex items-center gap-1.5 text-sm tabular-nums shrink-0">
                            <ClockIcon size={18} /><span className="sr-only">時間：</span>{formatAgo(post.created_at)}
                        </span>
                    </div>
                    {canSeeHistory && <HistoryToggle postId={post.id} />}
                </li>
            );
        };

        // ==========================================
        // 我的禱告
        // ==========================================
        const MineView = ({ session, role, onLogin, goHome, goEdit, flash }) => {
            const [tab, setTab] = useState('all');
            const [posts, setPosts] = useState([]);
            const [reasons, setReasons] = useState({});
            const [status, setStatus] = useState('loading');
            const [openHistory, setOpenHistory] = useState(null);

            const load = useCallback(async () => {
                if (!session) return;
                setStatus('loading');
                try {
                    const list = await api.myPosts(session.user.id);
                    setPosts(list);
                    setReasons(await api.latestReturnReasons(list.filter(p => p.review_status === 'returned').map(p => p.id)));
                    setStatus('ok');
                } catch (err) { console.error('讀取失敗:', err); setStatus('error'); }
            }, [session?.user?.id]);
            useEffect(() => { load(); }, [load]);

            if (!session) return <PageShell back={<BackButton onClick={goHome} label="返回禱告牆" />}><NeedLogin onLogin={onLogin} /></PageShell>;

            const tabs = [{ id: 'all', label: '全部' }, { id: 'pending', label: '待審查' }, { id: 'approved', label: '已核准' }, { id: 'returned', label: '已退回' }];
            const shown = tab === 'all' ? posts : posts.filter(p => p.review_status === tab);

            return (
                <PageShell back={<BackButton onClick={goHome} label="返回禱告牆" />}>
                    <div className="flex items-end justify-between gap-4 mb-6">
                        <h2 className="text-2xl font-semibold text-zinc-900">我的禱告</h2>
                    </div>
                    {flash && <div role="status" className="flex items-start gap-2 text-sm font-medium text-emerald-700 bg-emerald-50 border border-emerald-100 rounded-lg px-3 py-2.5 mb-6"><span className="mt-0.5 shrink-0"><CheckIcon size={16} /></span>{flash}</div>}
                    <TabBar tabs={tabs} value={tab} onChange={setTab} />

                    {status === 'loading' && <Skeletons />}
                    {status === 'error' && <ErrorBox message="暫時無法載入，稍後再試" onRetry={load} />}
                    {status === 'ok' && shown.length === 0 && <EmptyBox message={tab === 'all' ? '你還沒有貼文' : '目前沒有貼文'} />}
                    {status === 'ok' && shown.length > 0 && (
                        <ul className="flex flex-col gap-4">
                            {shown.map(p => <MyPostCard key={p.id} post={p} reason={reasons[p.id]} showStatus={tab === 'all'} goEdit={goEdit} canSeeHistory={REVIEWER_ROLES.includes(role)} />)}
                        </ul>
                    )}
                </PageShell>
            );
        };

        // ==========================================
        // 修改被退回的貼文並重新送審
        // ==========================================
        const EditView = ({ id, session, onLogin, goMine, notify }) => {
            const [post, setPost] = useState(null);
            const [status, setStatus] = useState('loading');
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState('');

            useEffect(() => {
                if (!session) return;
                let alive = true;
                (async () => {
                    try {
                        const list = await api.myPosts(session.user.id);
                        const found = list.find(p => p.id === id);
                        if (!alive) return;
                        if (!found || found.review_status !== 'returned') { setStatus('notfound'); return; }
                        setPost(found); setStatus('ok');
                    } catch (err) { console.error(err); if (alive) setStatus('error'); }
                })();
                return () => { alive = false; };
            }, [id, session?.user?.id]);

            if (!session) return <PageShell back={<BackButton onClick={goMine} />}><NeedLogin onLogin={onLogin} /></PageShell>;

            const handle = async (values) => {
                setBusy(true); setError('');
                try {
                    await api.resubmit(id, values);
                    notify('重新送審成功，請耐心等候');
                    goMine();
                } catch (err) { setError(err.message || '送出失敗，稍後再試'); }
                finally { setBusy(false); }
            };

            return (
                <PageShell back={<BackButton onClick={goMine} label="返回我的禱告" />}>
                    <h2 className="text-2xl font-semibold text-zinc-900 mb-6">重新送審</h2>
                    {status === 'loading' && <Skeletons />}
                    {status === 'error' && <ErrorBox message="暫時無法載入，稍後再試" />}
                    {status === 'notfound' && <EmptyBox message="找不到貼文" action={<button onClick={goMine} className={btnDark}>回到我的禱告</button>} />}
                    {status === 'ok' && post && (
                        <PostForm
                            initial={{ content: post.content, category: post.category, is_public: post.is_public, show_name: post.show_name }}
                            submitLabel="重新送審" busy={busy} error={error} onSubmit={handle} onCancel={goMine} />
                    )}
                </PageShell>
            );
        };

        // ==========================================
        // 審查頁（牧師、區長、admin）
        // 這裡的按鈕只是方便使用；真正的權限由資料庫檢查
        // ==========================================
        const pillCls = (active) => `px-4 py-2 rounded-full text-sm font-medium border transition-colors duration-150 active:scale-[0.98] ${focusRing} ${active ? 'bg-zinc-900 border-zinc-900 text-white' : 'bg-white border-zinc-200 text-zinc-600 hover:bg-zinc-50 hover:border-zinc-300'}`;

        const ReviewCard = ({ post, onChanged, onPatch, onRemove, onDeleted }) => {
            const [isPublic, setIsPublic] = useState(post.is_public);   // 待審查：核准時才套用
            const [returning, setReturning] = useState(false);
            const [reason, setReason] = useState('');
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState('');
            const [editing, setEditing] = useState(false);
            const [saving, setSaving] = useState(false);
            const [draft, setDraft] = useState({ content: post.content });
            const [confirmDel, setConfirmDel] = useState(false);
            const [deleting, setDeleting] = useState(false);
            // 先讓卡片立刻消失（畫面馬上有反應），資料庫在背景刪除；
            // 不論成功或失敗，最後都重新整理清單（失敗時貼文會自動回來並提示）
            const doDelete = () => {
                setConfirmDel(false);
                (onDeleted || onRemove)(post.id);
                api.deletePost(post.id)
                    .catch((err) => { showToast(err.message || '刪除失敗，貼文已還原'); })
                    .finally(() => { onChanged(); });
            };

            // 核准或退回：成功後這張卡片立刻從「待審查」消失，再到背景更新清單
            const run = async (fn) => {
                setBusy(true); setError('');
                try { await fn(); onRemove(post.id); onChanged(); }
                catch (err) { setError(err.message || '操作失敗，稍後再試'); setBusy(false); }
            };

            // 就地更新：先立刻改畫面，再通知資料庫；失敗才還原。不重新載入清單，所以畫面不會晃動。
            // 連點時只有「最新一次」失敗才會還原，避免舊請求把新的選擇蓋掉。
            const seq = useRef(0);
            const change = async (patch, call) => {
                const prev = {};
                Object.keys(patch).forEach(k => { prev[k] = post[k]; });
                const mine = ++seq.current;
                setError('');
                onPatch(post.id, patch);
                try { await call(); }
                catch (err) {
                    if (seq.current === mine) onPatch(post.id, prev);
                    setError(err.message || '操作失敗，稍後再試');
                }
            };

            useExclusiveEdit(editing, () => { setEditing(false); setError(''); });
            const startEdit = () => { setDraft({ content: post.content }); setError(''); setEditing(true); };
            const cancelEdit = () => { setEditing(false); setError(''); };
            const saveEdit = async () => {
                const content = draft.content.trim();
                if (!content) { setError('內容不可空白'); return; }
                if (content === post.content) { setEditing(false); return; }
                setSaving(true); setError('');
                try { await api.editContent(post.id, content); onPatch(post.id, { content }); setEditing(false); }
                catch (err) { setError(err.message || '儲存失敗，稍後再試'); }
                finally { setSaving(false); }
            };

            const pending = post.review_status === 'pending';
            const categoryFields = (
                <fieldset className="flex flex-col gap-2">
                    <legend className="text-xs font-medium text-zinc-500 mb-1">分類</legend>
                    <div className="flex flex-wrap gap-2">
                        {SUBMIT_CATEGORIES.map(c => {
                            const active = post.category === c.id;
                            return <button key={c.id} type="button" aria-pressed={active} className={pillCls(active)}
                                onClick={() => { if (!active) change({ category: c.id }, () => api.setCategory(post.id, c.id)); }}>{c.label}</button>;
                        })}
                    </div>
                </fieldset>
            );
            const visibilityFields = (
                <fieldset className="flex flex-col gap-2">
                    <legend className="text-xs font-medium text-zinc-500 mb-1">誰可以看到貼文</legend>
                    <div className="flex flex-wrap gap-2">
                        {[{ v: true, label: '公開' }, { v: false, label: '不公開' }].map(o => {
                            const active = (pending ? isPublic : post.is_public) === o.v;
                            return <button key={String(o.v)} type="button" aria-pressed={active} className={pillCls(active)}
                                onClick={() => {
                                    if (active) return;
                                    if (pending) setIsPublic(o.v);
                                    else change({ is_public: o.v }, () => api.setVisibility(post.id, o.v));
                                }}>{o.label}</button>;
                        })}
                    </div>
                </fieldset>
            );
            const privacyFields = (
                <fieldset className="flex flex-col gap-2">
                    <legend className="text-xs font-medium text-zinc-500 mb-1">隱私設定</legend>
                    <div className="flex flex-wrap gap-2">
                        {[{ v: false, label: '匿名' }, { v: true, label: '顯示姓名' }].map(o => {
                            const active = post.show_name === o.v;
                            return <button key={String(o.v)} type="button" aria-pressed={active} className={pillCls(active)}
                                onClick={() => { if (!active) change({ show_name: o.v }, () => api.setPrivacy(post.id, o.v)); }}>{o.label}</button>;
                        })}
                    </div>
                </fieldset>
            );
            const historyBlock = <HistoryToggle postId={post.id} />;
            const shownName = post.show_name ? post.author_name : ANON_NAME;
            const ghostBtn = btnGhost;
            const timeSpan = (
                <span className="inline-flex items-center gap-1.5 text-sm tabular-nums shrink-0">
                    <ClockIcon size={18} /><span className="sr-only">時間：</span>{formatAgo(post.created_at)}
                </span>
            );
            const trashBtn = (
                <button type="button" onClick={() => setConfirmDel(true)} disabled={saving || deleting} aria-label="刪除貼文" title="刪除貼文"
                    className={`${btnGhost} hover:!text-red-600`}><TrashIcon size={16} />刪除</button>
            );
            const deleteBlock = confirmDel && (
                <ConfirmModal title="刪除貼文？" confirmLabel="刪除" busy={deleting} error={error}
                    onCancel={() => { setConfirmDel(false); setError(''); }} onConfirm={doDelete} />
            );
            const headerRow = (actions) => (
                <div className="flex items-center justify-between gap-3 mb-2.5">
                    <div className="flex items-center gap-3 min-w-0">
                        <CategoryAvatar id={post.category} />
                        <span className="text-[15px] font-medium text-zinc-900 truncate min-w-0">{shownName}</span>
                    </div>
                    {actions}
                </div>
            );

            // 已退回：顯示方式同禱告牆貼文（退回的貼文沒有公開，所以水滴只是顯示、不能按，次數為 0）
            if (post.review_status === 'returned') {
                return (
                    <li className="bg-white rounded-lg border border-zinc-200 shadow-sm p-4 sm:p-5">
                        {headerRow(<div className="flex items-center gap-1 shrink-0">{trashBtn}</div>)}
                        <ClampText text={post.content} />
                        <div className="flex flex-wrap items-center gap-x-5 gap-y-2 mt-3 text-zinc-500">
                            <div className="flex items-center gap-1.5" aria-label="禱告回應次數 0">
                                <span className="-ml-2.5 p-2.5 text-zinc-400"><PrayIcon /></span>
                                <span className="text-sm tabular-nums font-medium text-zinc-500">0</span>
                            </div>
                            {timeSpan}
                        </div>
                        {deleteBlock}
                        <div className="mt-2"><InlineError message={error} /></div>
                    </li>
                );
            }

            // 待審查／已核准：顯示方式相同；按右上角「編輯」才展開內容與各項設定。待審查多了下方的核准、退回。
            const actions = (
                <div className="flex items-center gap-1 shrink-0">
                    {editing ? (
                        <>
                            <button type="button" onClick={cancelEdit} disabled={saving} className={ghostBtn}><XMarkIcon size={16} />取消</button>
                            <button type="button" onClick={saveEdit} disabled={saving} className={ghostBtn}><CheckIcon size={16} />{saving ? '儲存中' : '儲存'}</button>
                        </>
                    ) : (
                        <PostMenu onEdit={startEdit} onDelete={() => setConfirmDel(true)} />
                    )}
                </div>
            );
            const decideBlock = !pending ? null : returning ? (
                <div className="flex flex-col gap-3 mt-4">
                    <label className="text-sm font-medium text-zinc-700" htmlFor={`reason-${post.id}`}>退回原因</label>
                    <textarea id={`reason-${post.id}`} value={reason} onChange={(e) => setReason(e.target.value)} maxLength={500} rows={3} autoFocus className={`${inputCls} resize-y`} />
                    <div className="grid grid-cols-2 gap-3">
                        <button onClick={() => { setReturning(false); setReason(''); setError(''); }} disabled={busy} className={btnCancel}>取消</button>
                        <button onClick={() => run(() => api.returnPost(post.id, reason))} disabled={busy || !reason.trim()} className={btnReturnSoft}>{busy ? '處理中' : '退回'}</button>
                    </div>
                </div>
            ) : (
                <div className="grid grid-cols-2 gap-3 mt-4">
                    <button onClick={() => run(() => api.approve(post.id, isPublic))} disabled={busy}
                        className={`inline-flex items-center justify-center gap-2 h-12 rounded-full bg-emerald-700 hover:bg-emerald-800 active:bg-emerald-900 text-white text-base font-medium transition-colors duration-150 ${disabledCls} ${focusRing}`}>
                        <CheckIcon size={18} />{busy ? '處理中' : '核准'}
                    </button>
                    <button onClick={() => setReturning(true)} disabled={busy}
                        className={`inline-flex items-center justify-center gap-2 h-12 rounded-full border border-red-300 bg-white hover:bg-red-50 active:bg-red-100 text-red-700 text-base font-medium transition-colors duration-150 ${disabledCls} ${focusRing}`}>
                        <UndoIcon size={18} />退回
                    </button>
                </div>
            );
            return (
                <li className="bg-white rounded-lg border border-zinc-200 shadow-sm p-4 sm:p-5">
                    {headerRow(actions)}
                    {editing ? (
                        <label className="flex flex-col gap-1.5">
                            <span className="flex justify-between text-xs font-medium text-zinc-500">內容 <span className="tabular-nums text-zinc-400">{draft.content.length}/800</span></span>
                            <textarea value={draft.content} onChange={(e) => setDraft(d => ({ ...d, content: e.target.value }))} maxLength={800} rows={6} className={`${inputCls} leading-relaxed resize-y`} />
                        </label>
                    ) : (
                        <ClampText text={post.content} />
                    )}
                    <div className="flex flex-wrap items-center gap-x-5 gap-y-2 mt-3 text-zinc-500">
                        {pending && (
                            <span className="inline-flex items-center gap-1.5 text-sm min-w-0">
                                <UserIcon size={18} /><span className="sr-only">貼文：</span><span className="truncate max-w-[10rem]">{post.author_name}</span>
                            </span>
                        )}
                        {timeSpan}
                    </div>
                    {editing && (
                        <div className="flex flex-col gap-4 mt-4 pt-4 border-t border-zinc-100">
                            {categoryFields}
                            {visibilityFields}
                            {privacyFields}
                            {historyBlock}
                        </div>
                    )}
                    {decideBlock}
                    {deleteBlock}
                    <div className="mt-2"><InlineError message={error} /></div>
                </li>
            );
        };

        const ReviewView = ({ session, role, onLogin, goHome, refreshPending }) => {
            const [tab, setTab] = useState('pending');
            const [posts, setPosts] = useState([]);
            const [status, setStatus] = useState('loading');
            // 搜尋：輸入關鍵字後，改顯示所有狀態中符合的貼文
            const [query, setQuery] = useState('');
            const [results, setResults] = useState([]);
            const [sStatus, setSStatus] = useState('idle');
            const keyword = query.trim();
            const searching = keyword !== '';
            const reqId = useRef(0);

            // silent = true：背景更新，不顯示載入中的骨架畫面（避免畫面晃動）
            const load = useCallback(async (silent) => {
                if (silent !== true) setStatus('loading');
                try { setPosts(await api.postsByStatus(tab)); setStatus('ok'); }
                catch (err) { console.error('讀取審查清單失敗:', err); if (silent !== true) setStatus('error'); }
            }, [tab]);
            useEffect(() => { if (session && REVIEWER_ROLES.includes(role)) load(); }, [load, session, role]);

            const runSearch = useCallback(async (kw, silent) => {
                const mine = ++reqId.current;
                if (silent !== true) setSStatus('loading');
                try { const r = await api.searchAllPosts(kw); if (reqId.current === mine) { setResults(r); setSStatus('ok'); } }
                catch (err) { console.error('搜尋失敗:', err); if (reqId.current === mine && silent !== true) setSStatus('error'); }
            }, []);
            useEffect(() => {
                if (!session || !REVIEWER_ROLES.includes(role)) return;
                if (!searching) { reqId.current++; setSStatus('idle'); setResults([]); return; }
                const t = setTimeout(() => runSearch(keyword), 350);
                return () => clearTimeout(t);
            }, [keyword, searching, session, role, runSearch]);

            const onPatch = (id, patch) => { setPosts(l => l.map(p => p.id === id ? { ...p, ...patch } : p)); setResults(l => l.map(p => p.id === id ? { ...p, ...patch } : p)); };
            // 核准／退回：一般清單中卡片消失；搜尋時貼文還在，所以改成重新搜尋更新狀態
            const onRemove = (id) => { if (!searching) setPosts(l => l.filter(p => p.id !== id)); };
            const onDeleted = (id) => { setPosts(l => l.filter(p => p.id !== id)); setResults(l => l.filter(p => p.id !== id)); };

            if (!session) return <PageShell back={<BackButton onClick={goHome} label="返回禱告牆" />}><NeedLogin onLogin={onLogin} /></PageShell>;
            if (!REVIEWER_ROLES.includes(role)) return <PageShell back={<BackButton onClick={goHome} label="返回禱告牆" />}><EmptyBox message="權限不足" /></PageShell>;

            const tabs = [{ id: 'pending', label: '待審查' }, { id: 'returned', label: '已退回' }];
            const onChanged = async () => { if (searching) await runSearch(keyword, true); else await load(true); refreshPending(); };

            return (
                <PageShell back={<BackButton onClick={goHome} label="返回禱告牆" />}>
                    <h2 className="text-2xl font-semibold text-zinc-900 mb-4">貼文審核</h2>
                    <div role="search" className="relative mb-5">
                        <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-400 pointer-events-none"><SearchIcon size={20} /></span>
                        <input type="text" value={query} onChange={(e) => setQuery(e.target.value)} maxLength={100} enterKeyHint="search" placeholder="搜尋內容或貼文者" aria-label="搜尋貼文"
                            className="w-full bg-zinc-100 rounded-full pl-11 pr-11 py-3 text-zinc-900 font-medium placeholder:text-zinc-400 hover:bg-zinc-200/70 focus:outline-none focus:ring-2 focus:ring-emerald-600/30 transition-colors duration-150" />
                        {searching && (
                            <button type="button" onClick={() => setQuery('')} aria-label="清除搜尋"
                                className={`absolute right-1.5 top-1/2 -translate-y-1/2 p-2 rounded-full text-zinc-500 hover:text-zinc-900 hover:bg-zinc-200 active:bg-zinc-300 transition-colors duration-150 ${focusRing}`}><XIcon size={18} /></button>
                        )}
                    </div>

                    {searching ? (
                        <>
                            {sStatus === 'loading' && <Skeletons />}
                            {sStatus === 'error' && <ErrorBox message="暫時無法搜尋，稍後再試" onRetry={() => runSearch(keyword)} />}
                            {sStatus === 'ok' && results.length === 0 && <EmptyBox message="找不到，換個關鍵字試試" />}
                            {sStatus === 'ok' && results.length > 0 && (
                                <ul className="flex flex-col gap-4">
                                    {results.map(p => <ReviewCard key={p.id} post={p} onChanged={onChanged} onPatch={onPatch} onRemove={onRemove} onDeleted={onDeleted} />)}
                                </ul>
                            )}
                            {sStatus === 'ok' && results.length >= 50 && <p className="text-center text-sm text-zinc-400 mt-6">只顯示最新 50 則，請縮小條件</p>}
                        </>
                    ) : (
                        <>
                            <TabBar tabs={tabs} value={tab} onChange={setTab} />
                            {status === 'loading' && <Skeletons />}
                            {status === 'error' && <ErrorBox message="無法載入審查清單，稍後再試" onRetry={() => load()} />}
                            {status === 'ok' && posts.length === 0 && <EmptyBox message={tab === 'pending' ? '目前沒有貼文' : '目前沒有貼文'} />}
                            {status === 'ok' && posts.length > 0 && (
                                <ul className="flex flex-col gap-4">
                                    {posts.map(p => <ReviewCard key={p.id} post={p} onChanged={onChanged} onPatch={onPatch} onRemove={onRemove} onDeleted={onDeleted} />)}
                                </ul>
                            )}
                        </>
                    )}
                </PageShell>
            );
        };

        // ==========================================
        // 通知頁（站內通知：貼文被退回時，提報者會收到）
        // ==========================================
        const NotificationsView = ({ session, role, onLogin, goHome, goEdit, refreshUnread }) => {
            const [items, setItems] = useState([]);   // 每筆：{ notice: 通知, post: 對應的貼文 }
            const [status, setStatus] = useState('loading');

            const load = useCallback(async () => {
                if (!session) return;
                setStatus('loading');
                try {
                    const notices = await api.notifications();
                    const posts = await api.postsByIds([...new Set(notices.map(n => n.post_id))]);
                    const byId = {};
                    posts.forEach(p => { byId[p.id] = p; });
                    setItems(notices.filter(n => byId[n.post_id]).map(n => ({ notice: n, post: byId[n.post_id] })));
                    setStatus('ok');
                    // 進到通知頁就視為全部已讀
                    api.markAllRead().then(refreshUnread).catch(() => {});
                } catch (err) { console.error('讀取通知失敗:', err); setStatus('error'); }
            }, [session?.user?.id]);
            useEffect(() => { load(); }, [load]);

            if (!session) return <PageShell back={<BackButton onClick={goHome} label="返回禱告牆" />}><NeedLogin onLogin={onLogin} /></PageShell>;

            return (
                <PageShell back={<BackButton onClick={goHome} label="返回禱告牆" />}>
                    <h2 className="text-2xl font-semibold text-zinc-900 mb-6">通知</h2>

                    {status === 'loading' && <Skeletons />}
                    {status === 'error' && <ErrorBox message="暫時無法載入，稍後再試" onRetry={load} />}
                    {status === 'ok' && items.length === 0 && <EmptyBox message="目前沒有通知" />}
                    {status === 'ok' && items.length > 0 && (
                        <ul className="flex flex-col gap-4">
                            {items.map(({ notice, post }) => (
                                <MyPostCard key={notice.id} post={post} reason={{ reason: notice.reason }} forceReason showStatus={false} goEdit={goEdit} canSeeHistory={REVIEWER_ROLES.includes(role)} />
                            ))}
                        </ul>
                    )}
                </PageShell>
            );
        };

        // ==========================================
        // 漢堡選單：在按鈕下方展開的小卡片（開啟時按鈕變成 X）
        // ==========================================
        // align：選單靠哪一側展開（左側漢堡用 left；右側「更多」三個點用 right）
        const MenuDropdown = ({ onClose, items, align = 'left', label = '主選單' }) => {
            useEffect(() => {
                const onKey = (e) => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [onClose]);
            return (
                <>
                    <div className="fixed inset-0 z-40" onClick={onClose} aria-hidden="true"></div>
                    <nav className={`absolute ${align === 'right' ? 'right-0' : 'left-0'} top-full mt-2 z-50 w-56 bg-white rounded-lg border border-zinc-100 shadow-lg overflow-hidden animate-fade-in`} aria-label={label}>
                        {items.map((n, i) => (
                            <button key={n.id} type="button" onClick={n.onClick} aria-current={n.active ? 'page' : undefined}
                                className={`w-full flex items-center gap-3 px-4 py-3.5 text-left text-sm font-medium transition-colors duration-150 focus-visible:outline-none focus-visible:bg-zinc-100 ${i > 0 ? 'border-t border-zinc-100' : ''} ${n.active ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-600 hover:bg-zinc-50 hover:text-zinc-900 active:bg-zinc-100'}`}>
                                <span className="shrink-0">{n.icon}</span>{n.label}
                                {n.badge > 0 && <span className="ml-auto inline-flex items-center justify-center min-w-5 h-5 px-1 rounded-full bg-red-600 text-white text-xs font-medium tabular-nums">{n.badge > 99 ? '99+' : n.badge}</span>}
                            </button>
                        ))}
                    </nav>
                </>
            );
        };

        // ==========================================
        // 外框：頁首（漢堡選單｜守望花園｜新增貼文、搜尋、通知）與網址切換
        // 網址：prayer.html / #/search / #/submit / #/mine / #/edit/編號 / #/post/編號 / #/review
        // ==========================================
        const UUID = '([0-9a-fA-F-]{36})';
        const parseRoute = () => {
            const h = window.location.hash;
            if (h === '#/submit') return { name: 'submit' };
            if (h === '#/search') return { name: 'search' };
            if (h === '#/mine') return { name: 'mine' };
            if (h === '#/review') return { name: 'review' };
            if (h === '#/notifications') return { name: 'notifications' };
            const m = h.match(new RegExp(`^#/edit/${UUID}$`));
            if (m) return { name: 'edit', id: m[1] };
            const pm = h.match(new RegExp(`^#/post/${UUID}$`));
            if (pm) return { name: 'post', id: pm[1] };
            return { name: 'home' };
        };
        const go = (hash) => { window.location.hash = hash; window.scrollTo(0, 0); };

        const App = () => {
            const [route, setRoute] = useState(parseRoute());
            const [session, setSession] = useState(null);
            const [sessionReady, setSessionReady] = useState(false);
            const [role, setRole] = useState(null);
            const [memberName, setMemberName] = useState('');
            const [pending, setPending] = useState(0);
            const [unread, setUnread] = useState(0);
            const [showLogin, setShowLogin] = useState(false);
            const [flash, setFlash] = useState('');
            const [menuOpen, setMenuOpen] = useState(false);

            useEffect(() => {
                const onHash = () => { setRoute(parseRoute()); };
                window.addEventListener('hashchange', onHash);
                return () => window.removeEventListener('hashchange', onHash);
            }, []);

            useEffect(() => {
                supabase.auth.getSession().then(({ data }) => { setSession(data.session); setSessionReady(true); });
                const { data: { subscription } } = supabase.auth.onAuthStateChange((_e, s) => { setSession(s); setSessionReady(true); });
                return () => subscription.unsubscribe();
            }, []);

            // 登入後，依帳號（電話或 email）比對 members 表找出本人姓名，寫入共用的 tbc_user（做法同 manager.html）
            useEffect(() => {
                setMemberName('');
                if (!session?.user?.email) return;
                const emailLower = session.user.email.trim().toLowerCase();
                const accountLower = extractAccountFromEmail(session.user.email).trim().toLowerCase();
                let alive = true;
                supabase.from('members').select('name, email').then(({ data, error }) => {
                    if (!alive || error) { if (error) console.error('讀取本人姓名失敗:', error); return; }
                    const mine = (data || []).find(m => {
                        const me = (m.email || '').trim().toLowerCase();
                        return me === emailLower || me === accountLower;
                    });
                    if (mine?.name) { setSharedUser(mine.name); setMemberName(mine.name); }
                });
                return () => { alive = false; };
            }, [session?.user?.email]);

            // 登入後讀自己的角色（只是決定要不要顯示審查入口；真正權限在資料庫）
            useEffect(() => {
                setRole(null); setPending(0);
                if (!session?.user?.id) return;
                let alive = true;
                supabase.from('user_roles').select('role').eq('user_uid', session.user.id).maybeSingle()
                    .then(({ data }) => { if (alive) setRole(data?.role || 'user'); });
                return () => { alive = false; };
            }, [session?.user?.id]);

            const isReviewer = REVIEWER_ROLES.includes(role);
            viewerState.isReviewer = isReviewer;
            const refreshPending = useCallback(() => { api.pendingCount().then(setPending).catch(() => {}); }, []);
            useEffect(() => { if (isReviewer) refreshPending(); }, [isReviewer, refreshPending]);

            // 未讀通知數：登入後讀取，之後每分鐘與回到分頁時更新
            const refreshUnread = useCallback(() => { api.unreadCount().then(setUnread).catch(() => {}); }, []);
            useEffect(() => {
                setUnread(0);
                if (!session?.user?.id) return;
                refreshUnread();
                const timer = setInterval(refreshUnread, 60000);
                window.addEventListener('focus', refreshUnread);
                return () => { clearInterval(timer); window.removeEventListener('focus', refreshUnread); };
            }, [session?.user?.id, refreshUnread]);

            // 提示訊息 6 秒後自動消失
            const notify = (msg) => setFlash(msg);
            useEffect(() => {
                const onExpired = () => { setShowLogin(true); setFlash('登入已過期，請重新登入'); };
                window.addEventListener('tbc-auth-expired', onExpired);
                return () => window.removeEventListener('tbc-auth-expired', onExpired);
            }, []);
            useEffect(() => {
                if (!flash) return;
                const t = setTimeout(() => setFlash(''), 6000);
                return () => clearTimeout(t);
            }, [flash]);

            const logout = async () => { setMenuOpen(false); clearDraft(); clearSharedUser(); await supabase.auth.signOut(); go('#'); };
            const goHome = () => go('#');
            const goMine = () => go('#/mine');
            const requireLogin = (hash) => { if (!session) setShowLogin(true); else go(hash); };
            const closeThen = (fn) => () => { setMenuOpen(false); fn(); };

            const menuItems = [
                { id: 'index', label: '回首頁', icon: <HouseIcon size={20} />, onClick: closeThen(() => { window.location.href = './index.html'; }) },
                { id: 'serve', label: '我的服事', icon: <ClockIcon size={20} />, onClick: closeThen(() => { window.location.href = './search.html'; }) },
                { id: 'settings', label: '個人設定', icon: <UsersIcon size={20} />, onClick: closeThen(() => { window.location.href = './manager.html'; }) },
                session
                    ? { id: 'out', label: '登出', icon: <LogOutIcon size={20} />, onClick: logout }
                    : { id: 'in', label: '登入', icon: <LogInIcon size={20} />, onClick: closeThen(() => setShowLogin(true)) },
            ];
            const activeNav = route.name === 'edit' ? 'mine' : route.name;

            // 右上角功能圖示：手機寬度放不下時，自動收合成一個「三個點」按鈕，點開後以選單列出
            const rowRef = useRef(null);
            const leftRef = useRef(null);
            const [collapsed, setCollapsed] = useState(false);
            const [moreOpen, setMoreOpen] = useState(false);
            const iconCount = 4 + (isReviewer ? 1 : 0);   // 新增貼文、搜尋、通知、我的禱告（＋審核）
            useLayoutEffect(() => {
                const row = rowRef.current, left = leftRef.current;
                if (!row || !left) return;
                const measure = () => {
                    const cs = getComputedStyle(row);
                    const inner = row.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
                    const leftW = Math.max(left.offsetWidth, left.scrollWidth);
                    const iconW = window.innerWidth < 360 ? 40 : 44;    // 與下方 iconBtn 的寬度一致
                    setCollapsed(iconCount * iconW + 8 > inner - leftW);
                };
                measure();
                const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(measure) : null;
                if (ro) ro.observe(row); else window.addEventListener('resize', measure);
                if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
                return () => { if (ro) ro.disconnect(); else window.removeEventListener('resize', measure); };
            }, [iconCount, route.name]);
            useEffect(() => { if (!collapsed) setMoreOpen(false); }, [collapsed]);

            const goThen = (fn) => () => { setMoreOpen(false); fn(); };
            const moreItems = [
                { id: 'm-add', label: '新增貼文', icon: <SquarePlusIcon size={20} />, onClick: goThen(() => requireLogin('#/submit')) },
                { id: 'm-search', label: '搜尋', icon: <SearchIcon size={20} />, onClick: goThen(() => openSearch()) },
                { id: 'm-bell', label: '通知', icon: <BellIcon size={20} />, badge: session ? unread : 0, active: route.name === 'notifications', onClick: goThen(() => { setUnread(0); requireLogin('#/notifications'); }) },
                { id: 'm-mine', label: '我的禱告', icon: <HandHeartIcon size={20} />, active: route.name === 'mine' || route.name === 'edit', onClick: goThen(() => requireLogin('#/mine')) },
                ...(isReviewer ? [{ id: 'm-review', label: '貼文審核', icon: <ClipboardCheckIcon size={20} />, badge: pending, active: route.name === 'review', onClick: goThen(() => go('#/review')) }] : []),
            ];
            const moreBadge = (session ? unread : 0) + (isReviewer ? pending : 0);

            let body;
            if (!sessionReady && ['submit', 'mine', 'edit', 'review', 'notifications'].includes(route.name)) body = <PageShell><Skeletons /></PageShell>;
            else if (route.name === 'post') body = <PostDetailView key={route.id} id={route.id} goBack={() => { if (window.history.length > 1) window.history.back(); else goHome(); }} />;
            else if (route.name === 'search') body = <SearchView goHome={goHome} />;
            else if (route.name === 'submit') body = <SubmitView session={session} onLogin={() => setShowLogin(true)} goMine={goMine} goHome={goHome} notify={notify} />;
            else if (route.name === 'mine') body = <MineView session={session} role={role} onLogin={() => setShowLogin(true)} goHome={goHome} goEdit={(id) => go(`#/edit/${id}`)} flash={flash} />;
            else if (route.name === 'edit') body = <EditView key={route.id} id={route.id} session={session} onLogin={() => setShowLogin(true)} goMine={goMine} notify={notify} />;
            else if (route.name === 'notifications') body = <NotificationsView session={session} role={role} onLogin={() => setShowLogin(true)} goHome={goHome} goEdit={(id) => go(`#/edit/${id}`)} refreshUnread={refreshUnread} />;
            else if (route.name === 'review') body = <ReviewView session={session} role={role} onLogin={() => setShowLogin(true)} goHome={goHome} refreshPending={refreshPending} />;
            else body = <HomeView goSubmit={() => requireLogin('#/submit')} session={session} role={role} memberName={memberName} />;

            const iconBtn = `relative inline-flex items-center justify-center w-11 h-11 max-[359px]:w-10 max-[359px]:h-10 rounded-full text-zinc-800 hover:bg-zinc-100 active:bg-zinc-200 transition-colors duration-150 ${focusRing}`;

            return (
                <div className="min-h-screen flex flex-col">
                    {route.name !== 'search' && (
                        <header className="bg-white border-b border-zinc-200 sticky top-0 z-40" style={{ paddingTop: 'env(safe-area-inset-top, 0px)' }}>
                            <div ref={rowRef} className="max-w-2xl mx-auto w-full px-3 sm:px-5 h-14 flex items-center justify-between gap-2">
                                <div ref={leftRef} className="flex items-center min-w-0">
                                <div className="relative shrink-0">
                                    <button onClick={() => { setMoreOpen(false); setMenuOpen(o => !o); }} aria-label={menuOpen ? '關閉選單' : '開啟選單'} aria-expanded={menuOpen}
                                        className={`${iconBtn} ${menuOpen ? '!bg-zinc-100 !rounded-lg' : ''} relative z-50`}>
                                        {menuOpen ? <XIcon size={24} /> : <MenuIcon size={24} />}
                                    </button>
                                    {menuOpen && <MenuDropdown onClose={() => setMenuOpen(false)} items={menuItems} />}
                                </div>
                                <a href="#" onClick={(e) => { e.preventDefault(); goHome(); }} className={`ml-1 px-2 py-1 rounded-md ${focusRing}`}>
                                    <h1 className="text-base min-[360px]:text-lg font-semibold text-zinc-900 whitespace-nowrap">守望花園</h1>
                                </a>
                                </div>
                                {collapsed ? (
                                <div className="relative shrink-0">
                                    <button onClick={() => { setMenuOpen(false); setMoreOpen(o => !o); }} aria-label={moreOpen ? '關閉更多功能' : (moreBadge > 0 ? `更多功能，${moreBadge} 則提醒` : '更多功能')} aria-expanded={moreOpen} title="更多"
                                        className={`${iconBtn} ${moreOpen ? '!bg-zinc-100 !rounded-lg' : ''} relative z-50`}>
                                        {moreOpen ? <XIcon size={24} /> : <EllipsisVerticalIcon size={24} />}
                                        {!moreOpen && moreBadge > 0 && <span className="absolute -top-0.5 -right-0.5 inline-flex items-center justify-center min-w-5 h-5 px-1 rounded-full bg-red-600 text-white text-xs font-medium tabular-nums">{moreBadge > 99 ? '99+' : moreBadge}</span>}
                                    </button>
                                    {moreOpen && <MenuDropdown align="right" label="更多功能" onClose={() => setMoreOpen(false)} items={moreItems} />}
                                </div>
                                ) : (
                                <div className="justify-self-end flex items-center">
                                    <button onClick={() => requireLogin('#/submit')} aria-label="新增貼文" title="新增貼文" className={iconBtn}><SquarePlusIcon size={24} /></button>
                                    <button onClick={openSearch} aria-label="搜尋" title="搜尋" className={iconBtn}><SearchIcon size={24} /></button>
                                    <button onClick={() => { setUnread(0); requireLogin('#/notifications'); }} aria-label={unread > 0 ? `通知，${unread} 則未讀` : '通知'} title="通知" className={`${iconBtn} ${route.name === 'notifications' ? 'bg-zinc-100' : ''}`}>
                                        <BellIcon size={24} />
                                        {session && unread > 0 && <span className="absolute -top-0.5 -right-0.5 inline-flex items-center justify-center min-w-5 h-5 px-1 rounded-full bg-red-600 text-white text-xs font-medium tabular-nums">{unread > 99 ? '99+' : unread}</span>}
                                    </button>
                                    <button onClick={() => requireLogin('#/mine')} aria-label="我的禱告" title="我的禱告" className={`${iconBtn} ${route.name === 'mine' || route.name === 'edit' ? 'bg-zinc-100' : ''}`}><HandHeartIcon size={24} /></button>
                                    {isReviewer && (
                                        <button onClick={() => go('#/review')} aria-label={pending > 0 ? `貼文審核，${pending} 則待審查` : '貼文審核'} title="貼文審核" className={`${iconBtn} ${route.name === 'review' ? 'bg-zinc-100' : ''}`}>
                                            <ClipboardCheckIcon size={24} />
                                            {pending > 0 && <span className="absolute -top-0.5 -right-0.5 inline-flex items-center justify-center min-w-5 h-5 px-1 rounded-full bg-red-600 text-white text-xs font-medium tabular-nums">{pending > 99 ? '99+' : pending}</span>}
                                        </button>
                                    )}
                                </div>
                                )}
                            </div>
                        </header>
                    )}

                    {route.name !== 'mine' && flash && (
                        <div className="max-w-2xl mx-auto w-full px-4 sm:px-6 pt-4"><div role="status" className="text-sm font-medium text-emerald-700 bg-emerald-50 border border-emerald-100 rounded-lg px-3 py-2.5">{flash}</div></div>
                    )}

                    {body}
                    {showLogin && <LoginModal onClose={() => setShowLogin(false)} />}
                </div>
            );
        };

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
