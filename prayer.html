:where(.tbc-lg) input{ font:inherit; font-size:16px; color:inherit; margin:0; }

.tbc-lg-x{ width:44px; height:44px; flex:none; border-radius:50%; background:var(--bg,#fff); border:1px solid var(--lg-line) !important; display:flex; align-items:center; justify-content:center; transition:background-color .15s ease; }
.tbc-lg-x:hover{ background:var(--hov-soft,#fafafa); } .tbc-lg-x:active{ background:var(--hov,#f4f4f5); }

@keyframes tbcLgIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce){ .tbc-lg-card{ animation:none; } }
.tbc-lg-f{ margin-bottom:16px; }
.tbc-lg-f label{ display:block; font-size:12px; font-weight:500; color:var(--sub,#64748b); margin:0 0 6px 4px; }
.tbc-lg-f label b{ color:#ef4444; font-weight:500; }
.tbc-lg-w{ position:relative; }
.tbc-lg-ic{ position:absolute; left:16px; top:50%; transform:translateY(-50%); color:#94a3b8; pointer-events:none; display:flex; }
.tbc-lg-inp{ width:100%; background:var(--lg-field); border:1px solid var(--lg-field-line); border-radius:8px; padding:14px 16px 14px 44px; font-weight:600; color:var(--text,#262626); outline:none; transition:border-color .15s ease, box-shadow .15s ease; }
.tbc-lg-inp:hover{ border-color:#cbd5e1; }
.tbc-lg-inp:focus{ border-color:var(--primary,#8806ce); box-shadow:0 0 0 2px var(--primary-tint,#f2e5fb); }
.tbc-lg .tbc-lg-inp:focus-visible{ outline:none; }
.tbc-lg-inp.pw{ padding-right:48px; }
.tbc-lg-eye{ position:absolute; right:8px; top:50%; transform:translateY(-50%); padding:8px !important; border-radius:8px; color:#94a3b8; display:flex; }
.tbc-lg-eye:hover{ color:var(--primary,#8806ce); } .tbc-lg-eye:active{ background:var(--hov,#f4f4f5); }
.tbc-lg-tip{ display:flex; align-items:flex-start; gap:8px; font-size:12px; font-weight:500; line-height:1.6; color:var(--lg-warn-ink); background:var(--lg-warn-bg); border:1px solid var(--lg-warn-line); border-radius:8px; padding:12px; margin-bottom:16px; }
.tbc-lg-tip svg{ margin-top:2px; }
.tbc-lg-err{ display:flex; align-items:flex-start; gap:8px; color:var(--bad,#d4380d); background:rgba(220,38,38,.07); border:1px solid rgba(220,38,38,.18); border-radius:8px; padding:10px 12px; font-size:14px; font-weight:500; margin-bottom:16px; }
.tbc-lg-err svg{ flex:none; margin-top:2px; }
.tbc-lg-err span{ min-width:0; overflow-wrap:anywhere; }
.tbc-lg-sub{ width:100%; height:48px; margin-top:8px !important; border-radius:9999px; font-size:16px; font-weight:500; background:var(--btn,#334155); color:var(--on-btn,#fff); transition:background-color .15s ease; }
.tbc-lg-sub:hover{ background:var(--btn-hover,#1e293b); } .tbc-lg-sub:active{ background:var(--btn-press,#0f172a); }
.tbc-lg-sub:disabled{ opacity:.5; cursor:not-allowed; pointer-events:none; }
.tbc-lg-links{ margin-top:24px; display:flex; flex-direction:column; gap:16px; text-align:center; font-size:14px; font-weight:500; color:var(--sub,#64748b); }
.tbc-lg-links button{ color:var(--primary,#8806ce); font-weight:500; padding:4px 2px; }
.tbc-lg-links button:hover{ color:var(--primary-hover,#7205ad); }
.tbc-lg-note{ font-size:12px; color:#94a3b8; padding-top:16px; border-top:1px solid var(--lg-line); }
