.tbc-lg-sub:hover{ background:var(--btn-hover,#1e293b); } .tbc-lg-sub:active{ background:var(--btn-press,#0f172a); }
.tbc-lg-sub:disabled{ opacity:.5; cursor:not-allowed; pointer-events:none; }
.tbc-lg-links{ margin-top:24px; display:flex; flex-direction:column; gap:16px; text-align:center; font-size:14px; font-weight:500; color:var(--sub,#64748b); }

.tbc-lg-links button:hover{ color:var(--primary-hover,#7205ad); }
.tbc-lg-note{ font-size:12px; color:#94a3b8; padding-top:16px; border-top:1px solid var(--lg-line); }
