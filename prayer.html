        // 與 manager.html、search.html 連同一個專案（jcepavwocdujoeoqxvsd），登入狀態會自動共用。

        const { SUPABASE_URL, SUPABASE_KEY } = window.TBC_CONFIG;   // 來自 management/tbc-config.js

        const formatEmailForAuth = (acc) => { const t = (acc || '').trim(); return t.includes('@') ? t : `${t}${VIRTUAL_DOMAIN}`; };
        const extractAccountFromEmail = (email) => { if (!email) return ''; return email.endsWith(VIRTUAL_DOMAIN) ? email.replace(VIRTUAL_DOMAIN, '') : email; };

        // 與「我的服事」(search.html)、「個人設定」(manager.html) 共用的登入姓名：寫入同一個 tbc_user，到我的服事就不用再登入
        const setSharedUser = (name) => {
            if (!name) return;
            try { localStorage.setItem('tbc_user', name); } catch (e) {}
            try {
                const d = new Date(); d.setTime(d.getTime() + 30 * 24 * 60 * 60 * 1000);
                document.cookie = `tbc_user=${encodeURIComponent(name)}; expires=${d.toUTCString()}; path=/`;
            } catch (e) {}
        };
        const clearSharedUser = () => {
            try { localStorage.removeItem('tbc_user'); } catch (e) {}
            try { document.cookie = 'tbc_user=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;'; } catch (e) {}
        };

        const CATEGORIES = [
            { id: 'all', label: '全部' },
            { id: 'kingdom', label: '國度' },
            { id: 'outreach', label: '宣教' },
            { id: 'church', label: '教會' },
            { id: 'fellowship', label: '團契' },
            { id: 'personal', label: '個人' },
            { id: 'thanks', label: '感恩' },

        const SUBMIT_CATEGORIES = CATEGORIES.filter(c => c.id !== 'all');
        const categoryLabel = (id) => CATEGORIES.find(c => c.id === id)?.label || '';

            returned: { label: '已退回', cls: 'bg-red-50 text-red-700 border-red-200' },

            submitted: '貼文', approved: '核准', returned: '退回',
            resubmitted: '重新送審', visibility_changed: '誰可以看到貼文變更',

        let memoryVisitorId = null;
        const makeUuid = () => (window.crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); });

            try {
                let id = localStorage.getItem('tbc_prayer_visitor');
                if (!id || !/^[0-9a-f-]{36}$/i.test(id)) { id = makeUuid(); localStorage.setItem('tbc_prayer_visitor', id); }
                return id;
            } catch (e) {
                if (!memoryVisitorId) memoryVisitorId = makeUuid();
                return memoryVisitorId;
            }

            const d = new Date(iso);

        };
        const formatDateTime = (iso) => {
            const d = new Date(iso);
            return isNaN(d) ? '' : `${formatDate(iso)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        };

        const CrossIcon = (p) => <Icon {...p} d={<path d="M4 9a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h4a1 1 0 0 1 1 1v4a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-4a1 1 0 0 1 1-1h4a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-4a1 1 0 0 1-1-1V4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4a1 1 0 0 1-1 1z" />} />;
        const HandHeartIcon = (p) => <Icon {...p} d={<React.Fragment><path d="M11 14h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 16" /><path d="m7 20 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9" /><path d="m2 15 6 6" /><path d="M19.5 8.5c.7-.7 1.5-1.6 1.5-2.7A2.73 2.73 0 0 0 16 4a2.78 2.78 0 0 0-5 1.8c0 1.2.8 2 1.5 2.8L16 12Z" /></React.Fragment>} />;
        const UsersRoundIcon = (p) => <Icon {...p} d={<React.Fragment><path d="M18 21a8 8 0 0 0-16 0" /><circle cx="10" cy="8" r="5" /><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3" /></React.Fragment>} />;
        const CircleHelpIcon = (p) => <Icon {...p} d={<React.Fragment><circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><path d="M12 17h.01" /></React.Fragment>} />;
        const CircleCheckIcon = (p) => <Icon {...p} d={<React.Fragment><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></React.Fragment>} />;
        const CircleXIcon = (p) => <Icon {...p} d={<React.Fragment><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6" /><path d="m9 9 6 6" /></React.Fragment>} />;
        const UndoIcon = (p) => <Icon {...p} d={<React.Fragment><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" /></React.Fragment>} />;
        const XMarkIcon = (p) => <Icon {...p} d={<React.Fragment><path d="M18 6 6 18" /><path d="m6 6 12 12" /></React.Fragment>} />;
        const ShieldIcon = (p) => <Icon {...p} d={<React.Fragment><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /><path d="m9 12 2 2 4-4" /></React.Fragment>} />;
        const UserCheckIcon = (p) => <Icon {...p} d={<React.Fragment><path d="m16 11 2 2 4-4" /><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /></React.Fragment>} />;
        const FolderOpenIcon = (p) => <Icon {...p} d={<path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2" />} />;
        const StarIcon = (p) => <Icon {...p} d={<path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" />} />;
        const GraduationCapIcon = (p) => <Icon {...p} d={<React.Fragment><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" /><path d="M22 10v6" /><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" /></React.Fragment>} />;
        const MessageIcon = (p) => <Icon {...p} d={<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />} />;
        const ActivityIcon = (p) => <Icon {...p} d={<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" />} />;

        // 日期區間：開始日 00:00:00 到結束日 23:59:59（以瀏覽器所在時區計算）
        const dayStartISO = (d) => new Date(`${d}T00:00:00`).toISOString();
        const dayEndISO = (d) => new Date(`${d}T23:59:59.999`).toISOString();

        // ==========================================
        // 資料存取：全部透過資料庫的窗口（函式）或受警衛規則保護的查詢
        // ==========================================
        // 登入過期時通知畫面請使用者重新登入，而不是只顯示看不懂的錯誤
        const fail = (error) => {
            if (error && (error.status === 401 || /jwt expired|invalid jwt/i.test(error.message || ''))) window.dispatchEvent(new Event('tbc-auth-expired'));
            throw error;
        };
        const rpc = async (name, args) => {
            const { data, error } = await supabase.rpc(name, args);
            if (error) fail(error);
            return data;
        };
        const api = {
            search: async (keyword, category, from, to) => {
                const args = { p_keyword: keyword, p_category: category, p_visitor: getVisitorId() };
                if (from) args.p_from = dayStartISO(from);
                if (to) args.p_to = dayEndISO(to);
                return (await rpc('search_public_prayers', args)) || [];
            },
            detail: async (id) => { const d = await rpc('get_public_prayer', { p_id: id, p_visitor: getVisitorId() }); return (d && d[0]) || null; },
            respond: async (postId) => { const d = await rpc('respond_prayer', { p_post_id: postId, p_visitor: getVisitorId() }); return d && d[0]; },
            setCategory: (id, category) => rpc('set_prayer_category', { p_id: id, p_category: category }),
            editContent: (id, content) => rpc('edit_prayer_content', { p_id: id, p_content: content }),
            setPrivacy: (id, showName) => rpc('set_prayer_privacy', { p_id: id, p_show_name: showName }),
            submit: (v) => rpc('submit_prayer', { p_content: v.content, p_category: v.category, p_is_public: v.is_public, p_show_name: v.show_name }),
            resubmit: (id, v) => rpc('resubmit_prayer', { p_id: id, p_content: v.content, p_category: v.category, p_is_public: v.is_public, p_show_name: v.show_name }),
            approve: (id, isPublic) => rpc('approve_prayer', { p_id: id, p_is_public: isPublic }),
            returnPost: (id, reason) => rpc('return_prayer', { p_id: id, p_reason: reason }),
            deletePost: (id) => rpc('delete_prayer', { p_id: id }),
            setVisibility: (id, isPublic) => rpc('set_prayer_visibility', { p_id: id, p_is_public: isPublic }),
            myPosts: async (uid) => {
                const { data, error } = await supabase.from('prayer_posts').select('*').eq('author_uid', uid).order('created_at', { ascending: false });
                if (error) fail(error);
                return data || [];
            },
            postsByStatus: async (status) => {
                const { data, error } = await supabase.from('prayer_posts').select('*').eq('review_status', status).order('created_at', { ascending: false });
                if (error) fail(error);
                return data || [];
            },
            logsOfPost: async (id) => {
                const { data, error } = await supabase.from('prayer_review_logs').select('*').eq('post_id', id).order('created_at', { ascending: true });
                if (error) fail(error);
                return data || [];
            },
            latestReturnReasons: async (ids) => {
                if (!ids.length) return {};
                const { data, error } = await supabase.from('prayer_review_logs').select('post_id, reason, actor_name, created_at').eq('action', 'returned').in('post_id', ids).order('created_at', { ascending: true });
                if (error) fail(error);
                const map = {};
                (data || []).forEach(l => { map[l.post_id] = l; }); // 依時間排序，最後一筆就是最新的
                return map;
            },
            notifications: async () => {
                const { data, error } = await supabase.from('prayer_notifications').select('*').eq('is_read', false).order('created_at', { ascending: false }).limit(100);
                if (error) fail(error);
                return data || [];
            },
            // 審查者搜尋：所有狀態的貼文，比對內容或貼文者姓名（資料庫規則只允許審查角色讀取全部）
            searchAllPosts: async (keyword) => {
                const kw = keyword.replace(/[%*_,()"\\]/g, ' ').trim().slice(0, 100);
                if (!kw) return [];
                const { data, error } = await supabase.from('prayer_posts').select('*')
                    .or(`content.ilike.*${kw}*,author_name.ilike.*${kw}*`)
                    .order('created_at', { ascending: false }).limit(50);
                if (error) fail(error);
                return data || [];
            },
            postsByIds: async (ids) => {
                if (!ids.length) return [];
                const { data, error } = await supabase.from('prayer_posts').select('*').in('id', ids);
                if (error) fail(error);
                return data || [];
            },
            unreadCount: async () => {
                const { count, error } = await supabase.from('prayer_notifications').select('id', { count: 'exact', head: true }).eq('is_read', false);
                if (error) fail(error);
                return count || 0;
            },
            // 貼文「更新」（回覆）：誰能回覆、誰能看，都由資料庫判斷
            updates: async (postId) => {
                const d = await rpc('get_prayer_updates', { p_post_id: postId });
                return { canReply: !!(d && d.can_reply), items: (d && d.items) || [] };
            },
            addUpdate: (postId, content) => rpc('add_prayer_update', { p_post_id: postId, p_content: content }),
            deleteUpdate: (id) => rpc('delete_prayer_update', { p_id: id }),
            editUpdate: (id, content) => rpc('edit_prayer_update', { p_id: id, p_content: content }),
            updateCounts: async (ids) => (await rpc('get_prayer_update_counts', { p_ids: ids })) || {},
            markRead: (id) => rpc('mark_prayer_notification_read', { p_id: id }),
            markAllRead: () => rpc('mark_all_prayer_notifications_read', {}),
            pendingCount: async () => {
                const { count, error } = await supabase.from('prayer_posts').select('id', { count: 'exact', head: true }).eq('review_status', 'pending');
                if (error) fail(error);
                return count || 0;
            },
        };

        // ==========================================
        // 共用小元件
        // ==========================================
        const CategoryBadge = ({ id }) => (
            <span className="inline-flex items-center text-xs font-medium px-2.5 py-1 rounded-md bg-zinc-100 text-zinc-600">{categoryLabel(id)}</span>
        );
        const CategoryTag = ({ id }) => (
            <span className="inline-flex items-center gap-1.5 text-sm shrink-0"><TagIcon size={18} /><span className="sr-only">分類：</span>{categoryLabel(id)}</span>
        );
        // 貼文頭像：用「分類」的圖示（像 Threads 的大頭貼）
        const CATEGORY_ICON = { kingdom: EarthIcon, outreach: FootprintsIcon, church: ChurchIcon, fellowship: UsersRoundIcon, personal: UserIcon, thanks: GiftIcon };
        const CategoryAvatar = ({ id }) => {
            const I = CATEGORY_ICON[id] || UserIcon;
            return (
                <span className="w-10 h-10 shrink-0 rounded-full bg-zinc-100 text-indigo-600 flex items-center justify-center" title={categoryLabel(id)} role="img" aria-label={`分類：${categoryLabel(id)}`}>
                    <I size={20} />
                </span>
            );
        };
        // 圖示＋文字（文字顏色沿用原本各狀態的設定）
        const STATUS_ICON = { pending: CircleHelpIcon, approved: CircleCheckIcon, returned: CircleXIcon };
        const STATUS_TEXT = { pending: 'text-amber-700', approved: 'text-emerald-700', returned: 'text-red-700' };
        const StatusLabel = ({ status }) => {
            const I = STATUS_ICON[status];
            if (!I) return null;
            return <span className={`inline-flex items-center gap-1.5 text-sm shrink-0 ${STATUS_TEXT[status]}`}><I size={18} />{STATUS[status].label}</span>;
        };
        const StatusBadge = ({ status }) => (
            <span className={`inline-flex items-center text-xs font-medium px-2.5 py-1 rounded-md border ${STATUS[status]?.cls || ''}`}>{STATUS[status]?.label || status}</span>
        );
        const VisibilityBadge = ({ isPublic }) => (
            <span className="inline-flex items-center gap-1 text-xs font-medium px-2.5 py-1 rounded-md bg-zinc-100 text-zinc-600">
                {!isPublic && <LockIcon size={12} />}{isPublic ? '公開' : '不公開'}
            </span>
        );

        const SkeletonCard = () => (
            <div className="bg-white p-5 rounded-lg border border-zinc-200 animate-pulse" aria-hidden="true">
                <div className="h-5 w-3/5 bg-zinc-200 rounded mb-3"></div>
                <div className="h-3.5 w-full bg-zinc-100 rounded mb-2"></div>
                <div className="h-3.5 w-4/5 bg-zinc-100 rounded mb-5"></div>
                <div className="h-3 w-1/3 bg-zinc-100 rounded"></div>
            </div>
        );
        const Skeletons = () => <div className="flex flex-col gap-4"><SkeletonCard /><SkeletonCard /><SkeletonCard /></div>;

        const ErrorBox = ({ message, onRetry }) => (
            <div role="alert" className="bg-white border border-red-200 rounded-lg p-6 flex flex-col items-start gap-3">
                <div className="flex items-center gap-2 text-red-600 font-medium"><AlertIcon /> {message}</div>
                {onRetry && <button onClick={onRetry} className={btnDark}>重新載入</button>}
            </div>
        );
        const InlineError = ({ message }) => message ? (
            <div role="alert" className="flex items-start gap-2 text-sm font-medium text-red-600 bg-red-50 border border-red-100 rounded-lg px-3 py-2.5">
                <span className="mt-0.5 shrink-0"><AlertIcon size={16} /></span><span>{message}</span>
            </div>
        ) : null;

        const EmptyBox = ({ message, action }) => (
            <div className="bg-white border border-zinc-200 rounded-lg py-14 px-6 text-center flex flex-col items-center gap-4">
                <span className="text-zinc-300"><InboxIcon size={40} /></span>
                <p className="text-zinc-600 font-medium">{message}</p>
                {action}
            </div>
        );

        const PageShell = ({ children, back }) => (
            <main className="max-w-2xl mx-auto w-full px-4 sm:px-6 pt-8 pb-20 animate-fade-in">
                {back}
                {children}
            </main>
        );
        const BackButton = ({ onClick, label = '返回' }) => (
            <button onClick={onClick} className={`inline-flex items-center gap-2 px-3 py-2 -ml-3 mb-6 rounded-lg text-sm font-medium text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100 active:bg-zinc-200 transition-colors duration-150 ${focusRing}`}>
                <ArrowLeft size={16} /> {label}
            </button>
        );

        const TabBar = ({ tabs, value, onChange }) => (
            <div className="flex overflow-x-auto no-scrollbar gap-2 mb-6" role="tablist">
                {tabs.map(t => {
                    const active = value === t.id;
                    return (
                        <button key={t.id} role="tab" aria-selected={active} onClick={() => onChange(t.id)}
                            className={`px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap border transition-colors duration-150 active:scale-[0.98] ${focusRing} ${active ? 'bg-zinc-900 border-zinc-900 text-white' : 'bg-white border-zinc-200 text-zinc-600 hover:bg-zinc-50 hover:border-zinc-300'}`}>
                            {t.label}
                        </button>
                    );
                })}
            </div>
        );

        const NeedLogin = ({ onLogin }) => (
            <EmptyBox message="需要登入" action={<button onClick={onLogin} className={btnDark}>登入</button>} />
        );

        // ==========================================
        // 登入畫面（沿用 manager.html 的登入設計；帳號規則相同：電話號碼或 Email）
        // 註冊仍在 manager.html 進行
        // ==========================================
        const LoginModal = ({ onClose }) => {
            const [account, setAccount] = useState('');
            const [password, setPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState('');

            const submit = async (e) => {
                e.preventDefault();
                setBusy(true); setError('');
                const { error } = await supabase.auth.signInWithPassword({ email: formatEmailForAuth(account), password });
                setBusy(false);
                if (error) {
                    setError(error.message.includes('Invalid login credentials') ? '登入失敗：帳號或密碼錯誤' : '登入發生問題，稍後再試');
                    return;
                }
                onClose();
            };

            useEffect(() => {
                const onKey = (e) => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [onClose]);

            const fieldCls = "w-full bg-slate-50 border border-slate-200 rounded-lg pl-11 pr-4 py-3.5 outline-none hover:border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-colors duration-150 font-semibold text-slate-700";
            return (
                <div className="fixed inset-0 z-50 bg-slate-50 overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="login-title">
                    <div className="min-h-full w-full flex flex-col items-center justify-start sm:justify-center p-4 py-4 sm:py-8 relative">
                        <div className="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-indigo-600/10 blur-[120px] pointer-events-none"></div>
                        <div className="fixed bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-emerald-600/10 blur-[120px] pointer-events-none"></div>

                        <div className="w-full max-w-md flex items-center justify-between mb-4 relative z-20">
                            <button type="button" onClick={onClose} aria-label="關閉登入畫面"
                                className={`w-11 h-11 shrink-0 flex items-center justify-center rounded-full bg-white border border-slate-100 text-slate-700 hover:bg-slate-50 active:bg-slate-100 transition-colors duration-150 ${focusRing}`}>
                                <XIcon size={22} />
                            </button>
                            <span id="login-title" className="text-lg font-semibold text-slate-800">歡迎登入</span>
                            <div className="w-11 h-11 shrink-0"></div>
                        </div>

                        <div className="bg-white max-w-md w-full rounded-lg p-6 sm:p-8 border border-slate-100 animate-fade-in z-10 relative">
                            <form onSubmit={submit} className="space-y-4 sm:space-y-5">
                                <div className="space-y-1.5">
                                    <label htmlFor="login-account" className="text-xs font-medium text-slate-500 ml-1">帳號</label>
                                    <div className="relative">
                                        <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><UserIcon size={18} /></span>
                                        <input id="login-account" type="text" value={account} onChange={(e) => setAccount(e.target.value)} className={fieldCls} placeholder="電話號碼或電子郵件" required autoFocus autoComplete="username" />
                                    </div>
                                </div>

                                <div className="space-y-1.5">
                                    <label htmlFor="login-password" className="text-xs font-medium text-slate-500 ml-1">密碼</label>
                                    <div className="relative">
                                        <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><LockIcon size={18} /></span>
                                        <input id="login-password" type={showPassword ? 'text' : 'password'} value={password} onChange={(e) => setPassword(e.target.value)} className={`${fieldCls} pr-12`} placeholder="6位以上英數組合" required autoComplete="current-password" />
                                        <button type="button" onClick={() => setShowPassword(s => !s)} aria-label={showPassword ? '隱藏密碼' : '顯示密碼'}
                                            className={`absolute right-2 top-1/2 -translate-y-1/2 p-2 rounded-lg text-slate-400 hover:text-indigo-600 active:bg-slate-100 transition-colors duration-150 ${focusRing}`}>
                                            {showPassword ? <EyeOffIcon size={18} /> : <EyeIcon size={18} />}
                                        </button>
                                    </div>
                                </div>

                                <InlineError message={error} />

                                <button type="submit" disabled={busy}
                                    className={`w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium py-3.5 rounded-full transition-colors duration-150 mt-4 text-base ${disabledCls} ${focusRing}`}>
                                    {busy ? '處理中' : '登入'}
                                </button>
                            </form>

                            <div className="mt-6 flex flex-col gap-4 text-center">
                                <div className="text-sm font-medium text-slate-500">
                                    首次設定密碼？請<a href="./manager.html#signup" className={`font-medium text-indigo-600 hover:text-indigo-700 transition-colors duration-150 py-1 px-0.5 rounded ${focusRing}`}>點這裡</a>
                                </div>
                                <div className="text-xs font-medium text-slate-400 pt-4 border-t border-slate-100/80">沒有帳號、忘記密碼？請聯絡行政辦公室</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 「我已禱告」按鈕（免登入；一次、不可取消；次數由資料庫計算）
        // ==========================================
        // 禱告圖示：水滴。未禱告＝空的水滴（灰色線條）；按下後水位由下往上慢慢升滿。
        // 重新載入時，已禱告的貼文直接顯示滿的水滴（只有「按下的那一刻」才有升水動畫）。
        const DROP_PATH = "M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z";
        const PrayIcon = ({ size = 18, filled }) => {
            const clipId = 'drop' + React.useId().replace(/[^a-zA-Z0-9]/g, '');
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                    <defs><clipPath id={clipId}><path d={DROP_PATH} /></clipPath></defs>
                    <g clipPath={`url(#${clipId})`}>
                        <rect className="drop-fill" x="0" y="0" width="24" height="24" fill="currentColor" stroke="none" style={{ transform: `translateY(${filled ? 0 : 24}px)` }} />
                    </g>
                    <path d={DROP_PATH} />
                </svg>
            );
        };

        // 禱告成功後的鼓勵訊息。只有資料庫確認「新的有效回應」才會呼叫，不寫入任何資料。
        const THANKS_MESSAGE = '謝謝你的禱告與陪伴';
        let toastTimer = null;
        const showThanks = () => showToast(THANKS_MESSAGE);
        const showToast = (message) => {
            try {
                document.querySelectorAll('.prayer-toast').forEach(t => t.remove());
                if (toastTimer) clearTimeout(toastTimer);
                const toast = document.createElement('div');
                toast.className = 'prayer-toast';
                toast.setAttribute('role', 'status');
                toast.textContent = message;
                document.body.appendChild(toast);
                toastTimer = setTimeout(() => toast.remove(), 3500);
            } catch (e) { /* 訊息顯示失敗不影響禱告紀錄 */ }
        };

        // 點水滴：水位立即開始升滿並加一；按過就不能取消。失敗時會自動還原（水位退回）並由卡片顯示提示。
        const PrayButton = ({ postId, count, responded, onResponded, onError }) => {
            const [local, setLocal] = useState({ count, responded });
            const [popping, setPopping] = useState(false);
            useEffect(() => { setLocal({ count, responded }); }, [count, responded]);

            const click = async () => {
                if (local.responded) return;
                const before = local;
                setLocal({ count: before.count + 1, responded: true });
                setPopping(true); setTimeout(() => setPopping(false), 400);
                if (onError) onError('');
                try {
                    const r = await api.respond(postId);
                    const n = Number(r?.response_count ?? before.count + 1);
                    setLocal({ count: n, responded: true });
                    onResponded(n);
                    // 只有資料庫確認「這是新的有效回應」才顯示鼓勵訊息；重複回應（already_responded）不顯示
                    if (r && r.already_responded === false) showThanks();
                } catch (err) {
                    setLocal(before);
                    if (onError) onError(err.message || '暫時無法送出，稍後再試');
                }
            };

            const label = local.responded ? `已禱告，禱告回應次數 ${local.count}` : `我已禱告，目前禱告回應次數 ${local.count}`;
            return (
                <div className="flex items-center gap-1.5">
                    <button type="button" onClick={click} aria-pressed={local.responded} aria-label={label} title={local.responded ? '已禱告' : '一起禱告'}
                        className={`-ml-2.5 p-2.5 rounded-full transition-colors duration-150 ${focusRing} ${popping ? 'animate-pop' : ''} ${local.responded ? 'text-blue-500 cursor-default' : 'text-zinc-400 hover:text-blue-500 hover:bg-blue-50 active:bg-blue-100'}`}>
                        <PrayIcon filled={local.responded} />
                    </button>
                    <span className={`text-sm tabular-nums font-medium ${local.responded ? 'text-zinc-900' : 'text-zinc-500'}`}>{local.count}</span>
                </div>
            );
        };

        // ==========================================
        // 貼文卡片（像 IG）：內文固定顯示 3 行，「...更多」就地展開、「較少」就地收合，不會跳頁。
        // 卡片底部由左到右：禱告（圖示＋次數）、貼文者、時間，都只有圖示沒有文字。
        // ==========================================
        // 時間像 Threads：幾分鐘、幾小時、幾天；超過 7 天顯示年月日
        const formatAgo = (iso) => {
            const d = new Date(iso);
            if (isNaN(d)) return '';
            const sec = Math.max(0, (Date.now() - d.getTime()) / 1000);
            if (sec < 60) return '剛剛';
            if (sec < 3600) return `${Math.floor(sec / 60)}分鐘`;
            if (sec < 86400) return `${Math.floor(sec / 3600)}小時`;
            if (sec < 86400 * 7) return `${Math.floor(sec / 86400)}天`;
            return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}`;
        };

        // 內文固定顯示 3 行；超過才出現「...更多」，就地展開，展開後最後出現「較少」
        const ClampText = ({ text }) => {
            const [expanded, setExpanded] = useState(false);
            const [clamped, setClamped] = useState(false);
            const textRef = useRef(null);

            // 量一量：內文超過 3 行才需要「...更多」
            const measure = useCallback(() => {
                const el = textRef.current;
                if (el) setClamped(el.scrollHeight > el.clientHeight + 1);
            }, []);
            useLayoutEffect(() => { if (!expanded) measure(); }, [expanded, text, measure]);
            useEffect(() => {
                window.addEventListener('resize', measure);
                window.addEventListener('tbc-fontsize', measure);   // 按 A 改字級後，重新量一次要不要顯示「...更多」
                if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
                return () => { window.removeEventListener('resize', measure); window.removeEventListener('tbc-fontsize', measure); };
            }, [measure]);

            const fsStyle = { fontSize: 'var(--post-fs, 15px)', lineHeight: 1.6 };
            const moreCls = `font-medium text-zinc-400 hover:text-zinc-700 active:text-zinc-900 transition-colors duration-150 rounded ${focusRing}`;
            return expanded ? (
                <p style={fsStyle} className="text-zinc-700 whitespace-pre-line break-words">
                    {text}
                    <button type="button" onClick={() => setExpanded(false)} aria-expanded="true" style={fsStyle} className={`ml-2 ${moreCls}`}>較少</button>
                </p>
            ) : (
                <div className="relative">
                    <p ref={textRef} style={fsStyle} className="text-zinc-700 whitespace-pre-line break-words line-clamp-3">{text}</p>
                    {clamped && (
                        <button type="button" onClick={() => setExpanded(true)} aria-expanded="false" style={fsStyle}
                            className={`absolute right-0 bottom-0 pl-10 bg-gradient-to-l from-white from-70% to-transparent ${moreCls}`}>...更多</button>
                    )}
                </div>
            );
        };

        // 日期區間輸入：「開始」「結束」（一般搜尋與審查搜尋共用）
        const DateRange = ({ from, to, onFrom, onTo, className = '' }) => {
            const fieldCls = "w-full bg-zinc-100 rounded-lg px-3 py-2.5 text-sm text-zinc-900 font-medium hover:bg-zinc-200/70 focus:outline-none focus:ring-2 focus:ring-emerald-600/30 transition-colors duration-150";
            return (
                <div className={`grid grid-cols-2 gap-3 ${className}`} role="group" aria-label="日期區間">
                    <label className="flex flex-col gap-1 min-w-0">
                        <span className="text-xs font-medium text-zinc-500">開始</span>
                        <input type="date" value={from} onChange={(e) => onFrom(e.target.value)} max={to || undefined} className={fieldCls} />
                    </label>
                    <label className="flex flex-col gap-1 min-w-0">
                        <span className="text-xs font-medium text-zinc-500">結束</span>
                        <input type="date" value={to} onChange={(e) => onTo(e.target.value)} min={from || undefined} className={fieldCls} />
                    </label>
                </div>
            );
        };

        // 彈出視窗：確認刪除貼文（點背景、按 Esc 或「取消」都會關閉）
        const ConfirmModal = ({ title, confirmLabel, busy, error, onCancel, onConfirm }) => {
            useEffect(() => {
                const onKey = (e) => { if (e.key === 'Escape' && !busy) onCancel(); };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [busy, onCancel]);
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4" onClick={() => { if (!busy) onCancel(); }}>
                    <div role="alertdialog" aria-modal="true" aria-label={title} onClick={(e) => e.stopPropagation()}
                        className="w-full max-w-xs bg-white rounded-lg shadow-xl border border-zinc-200 p-6 flex flex-col gap-5">
                        <h3 className="text-lg font-semibold text-zinc-900 text-center">{title}</h3>
                        <InlineError message={error} />
                        <div className="grid grid-cols-2 gap-3">
                            <button type="button" onClick={onCancel} disabled={busy} autoFocus className={btnCancelWhite}>取消</button>
                            <button type="button" onClick={onConfirm} disabled={busy} className={btnReturnSoft}>{busy ? '刪除中' : confirmLabel}</button>
                        </div>
                    </div>
                </div>
            );
        };

        // 「更新」：只有圖示＋更新數量。點了切到這則貼文的完整畫面（貼文＋所有留言）。
        // 數量用「集中查詢」：同一個畫面的所有貼文，在 30 毫秒內合併成一次資料庫查詢。
        const updateCounts = { cache: {}, waiters: {}, timer: null };
        const fetchUpdateCount = (id) => new Promise((resolve) => {
            const c = updateCounts;
            if (id in c.cache) return resolve(c.cache[id]);
            (c.waiters[id] = c.waiters[id] || []).push(resolve);
            if (c.timer) return;
            c.timer = setTimeout(async () => {
                c.timer = null;
                const waiters = c.waiters; c.waiters = {};
                const ids = Object.keys(waiters);
                let map = null;
                try { map = await api.updateCounts(ids); } catch (e) { console.error('讀取回覆數量失敗:', e); }
                ids.forEach(i => {
                    const n = map ? Number(map[i]) || 0 : null;   // 讀取失敗時回傳 null，按鈕不顯示數字
                    if (n !== null) c.cache[i] = n;
                    waiters[i].forEach(r => r(n));
                });
            }, 30);
        });
        // 目前使用者是不是審查權限者（由 App 更新）：審查者即使還沒有更新，也能點進去新增第一則
        const viewerState = { isReviewer: false };
        const UpdatesButton = ({ postId, onClick, alwaysEnabled = false }) => {
            const [n, setN] = useState(updateCounts.cache[postId] ?? null);
            useEffect(() => {
                let alive = true;
                fetchUpdateCount(postId).then(v => { if (alive) setN(v); });
                return () => { alive = false; };
            }, [postId]);
            // 沒有更新就不能點進去（貼文者從「我的禱告」、審查者例外，因為他們要新增第一則）
            const disabled = n === 0 && !alwaysEnabled && !viewerState.isReviewer;
            if (disabled) {
                return (
                    <span className="inline-flex items-center gap-1.5 text-zinc-300 cursor-default select-none" aria-label="沒有回覆" title="沒有回覆">
                        <span className="p-2.5 -my-2.5 -mx-2.5 inline-flex"><MessageIcon size={18} /></span>
                        <span className="text-sm tabular-nums font-medium ml-2.5 min-w-[0.75rem]">0</span>
                    </span>
                );
            }
            return (
                <button type="button" onClick={onClick} aria-label={n === null ? '查看回覆' : `查看回覆，共 ${n} 則`} title="限定人員回覆"
                    className={`inline-flex items-center gap-1.5 text-zinc-400 hover:text-zinc-700 transition-colors duration-150 rounded-full ${focusRing}`}>
                    <span className="p-2.5 -my-2.5 -mx-2.5 rounded-full hover:bg-zinc-100 active:bg-zinc-200 transition-colors duration-150 inline-flex"><MessageIcon size={18} /></span>
                    <span className="text-sm tabular-nums font-medium text-zinc-500 ml-2.5 min-w-[0.75rem]">{n === null ? '' : n}</span>
                </button>
            );
        };

        // 權限圖示（圓形淺灰底）：圖示依權限，領袖、牧師、管理員用琥珀色
        const RoleAvatar = ({ role, size = 40 }) => {
            const info = roleInfoOf(role);
            const I = info.icon;
            return (
                <span style={{ width: size, height: size }} title={info.label} role="img" aria-label={`權限：${info.label}`}
                    className={`shrink-0 rounded-full bg-zinc-100 ${info.high ? 'text-amber-500' : 'text-zinc-500'} flex items-center justify-center`}>
                    <I size={Math.round(size / 2)} />
                </span>
            );
        };

        // 一則回覆：權限圖示＋姓名＋時間，下方是內容。審查權限者可以按「編輯」修改內容。
        const ReplyItem = ({ u, onSaved, onDeleted }) => {
            const [editing, setEditing] = useState(false);
            const [confirmDel, setConfirmDel] = useState(false);
            const [deleting, setDeleting] = useState(false);
            useExclusiveEdit(editing, () => { setEditing(false); setError(''); });
            const doDelete = async () => {
                setDeleting(true); setError('');
                try { await api.deleteUpdate(u.id); setConfirmDel(false); onDeleted(u.id); }
                catch (err) { setError(err.message || '刪除失敗，稍後再試'); }
                setDeleting(false);
            };
            const [draft, setDraft] = useState(u.content);
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState('');
            const fsStyle = { fontSize: 'var(--post-fs, 15px)', lineHeight: 1.6 };
            const save = async () => {
                const content = draft.trim();
                if (!content || busy) return;
                setBusy(true); setError('');
                try { await api.editUpdate(u.id, content); onSaved(u.id, content); setEditing(false); }
                catch (err) { setError(err.message || '暫時無法儲存，稍後再試'); }
                setBusy(false);
            };
            return (
                <div className="p-4 sm:p-5">
                    <div className="flex items-center justify-between gap-3 mb-2.5">
                        <div className="flex items-center gap-3 min-w-0">
                            <RoleAvatar role={u.author_role} />
                            <span className="text-[15px] font-medium text-zinc-900 truncate min-w-0">{u.author_name}</span>
                            <span className="text-sm text-zinc-400 tabular-nums shrink-0">{formatAgo(u.created_at)}</span>
                        </div>
                        {viewerState.isReviewer && !editing && (
                            <PostMenu onEdit={() => { setDraft(u.content); setError(''); setEditing(true); }} onDelete={() => { setError(''); setConfirmDel(true); }} />
                        )}
                    </div>
                    {editing ? (
                        <div className="flex flex-col gap-3">
                            <label className="flex flex-col gap-1.5">
                                <span className="flex justify-between text-sm font-medium text-zinc-700">回覆內容 <span className="text-xs tabular-nums text-zinc-400">{draft.length}/500</span></span>
                                <textarea value={draft} onChange={(e) => setDraft(e.target.value)} maxLength={500} rows={5} className={`${inputCls} leading-relaxed resize-y`} />
                            </label>
                            <InlineError message={error} />
                            <div className="grid grid-cols-2 gap-3">
                                <button type="button" onClick={() => { setEditing(false); setError(''); }} disabled={busy} className={btnCancelWhite}><XMarkIcon size={16} />取消</button>
                                <button type="button" onClick={save} disabled={busy || !draft.trim()} className={btnSubmitDark}><CheckIcon size={16} />{busy ? '儲存中…' : '儲存'}</button>
                            </div>
                        </div>
                    ) : (
                        <p style={fsStyle} className="text-zinc-700 whitespace-pre-line break-words">{u.content}</p>
                    )}
                    {confirmDel && (
                        <ConfirmModal title="刪除回覆？" confirmLabel="刪除" busy={deleting} error={error}
                            onCancel={() => { setConfirmDel(false); setError(''); }} onConfirm={doDelete} />
                    )}
                </div>
            );
        };

        // 貼文完整畫面（像 Threads）：上面是貼文，下面是所有留言，中間用灰線分隔。
        // 留言：權限圖示＋姓名＋時間，下方是內容。只有貼文者與審查權限者（資料庫判斷）會看到輸入框。
        const PostDetailView = ({ id, goBack }) => {
            const [post, setPost] = useState(undefined);       // undefined＝讀取中，null＝找不到
            const [isPublicView, setIsPublicView] = useState(true);
            const [state, setState] = useState({ status: 'loading', canReply: false, items: [] });
            const [text, setText] = useState('');
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState('');
            // 審查者：貼文本身的編輯、刪除
            const [postEditing, setPostEditing] = useState(false);
            const [postDraft, setPostDraft] = useState('');
            const [postSaving, setPostSaving] = useState(false);
            const [postConfirmDel, setPostConfirmDel] = useState(false);
            const [postDeleting, setPostDeleting] = useState(false);
            const [postError, setPostError] = useState('');
            useExclusiveEdit(postEditing, () => { setPostEditing(false); setPostError(''); });
            const savePost = async () => {
                const content = postDraft.trim();
                if (!content) { setPostError('內容不可空白'); return; }
                if (content === (post.content ?? post.summary ?? '')) { setPostEditing(false); return; }
                setPostSaving(true); setPostError('');
                try { await api.editContent(post.id, content); setPost(pst => ({ ...pst, content })); setPostEditing(false); }
                catch (err) { setPostError(err.message || '儲存失敗，稍後再試'); }
                setPostSaving(false);
            };
            const deletePost = async () => {
                setPostDeleting(true); setPostError('');
                try { await api.deletePost(post.id); setPostConfirmDel(false); goBack(); }
                catch (err) { setPostError(err.message || '刪除失敗，稍後再試'); }
                setPostDeleting(false);
            };

            useEffect(() => {
                let alive = true;
                setPost(undefined);
                (async () => {
                    let d = null;
                    try { d = await api.detail(id); } catch (e) { console.error('讀取貼文失敗:', e); }
                    if (!alive) return;
                    if (d) { setPost(d); setIsPublicView(true); return; }
                    // 不公開的貼文：貼文者本人與審查者讀得到（資料庫規則決定）
                    try {
                        const rows = await api.postsByIds([id]);
                        if (!alive) return;
                        const r = rows[0];
                        if (r) { setPost({ id: r.id, category: r.category, content: r.content, created_at: r.created_at, display_name: r.show_name ? r.author_name : ANON_NAME, response_count: 0, has_responded: false }); setIsPublicView(false); return; }
                    } catch (e) { console.error('讀取貼文失敗:', e); }
                    if (alive) setPost(null);
                })();
                api.updates(id)
                    .then(r => { if (!alive) return; updateCounts.cache[id] = r.items.length; setState({ status: 'ok', canReply: r.canReply, items: r.items }); })
                    .catch(err => { console.error('讀取回覆失敗:', err); if (alive) setState({ status: 'error', canReply: false, items: [] }); });
                return () => { alive = false; };
            }, [id]);

            const send = async () => {
                const content = text.trim();
                if (!content || busy) return;
                setBusy(true); setError('');
                try {
                    const row = await api.addUpdate(id, content);
                    setState(st => { const items = [...st.items, row]; updateCounts.cache[id] = items.length; return { ...st, items }; });
                    setText('');
                } catch (err) { setError(err.message || '暫時無法送出，稍後再試'); }
                setBusy(false);
            };

            const fsStyle = { fontSize: 'var(--post-fs, 15px)', lineHeight: 1.6 };
            const back = <BackButton onClick={goBack} label="返回" />;
            if (post === undefined) return <PageShell back={back}><Skeletons /></PageShell>;
            if (post === null) return <PageShell back={back}><EmptyBox message="找不到這則貼文，或它沒有公開" /></PageShell>;
            const name = !post.display_name || post.display_name === '匿名' ? ANON_NAME : post.display_name;

            return (
                <PageShell back={back}>
                    <div className="bg-white rounded-lg border border-zinc-200 shadow-sm divide-y divide-zinc-200">
                        {/* 貼文 */}
                        <div className="p-4 sm:p-5">
                            <div className="flex items-center justify-between gap-3 mb-2.5">
                                <div className="flex items-center gap-3 min-w-0">
                                    <CategoryAvatar id={post.category} />
                                    <span className="text-[15px] font-medium text-zinc-900 truncate min-w-0">{name}</span>
                                </div>
                                {viewerState.isReviewer && !postEditing && <PostMenu onEdit={() => { setPostDraft(post.content ?? post.summary ?? ''); setPostError(''); setPostEditing(true); }} onDelete={() => { setPostError(''); setPostConfirmDel(true); }} />}
                            </div>
                            {postEditing ? (
                                <div className="flex flex-col gap-3">
                                    <label className="flex flex-col gap-1.5">
                                        <span className="flex justify-between text-sm font-medium text-zinc-700">內容 <span className="text-xs tabular-nums text-zinc-400">{postDraft.length}/800</span></span>
                                        <textarea value={postDraft} onChange={(e) => setPostDraft(e.target.value)} maxLength={800} rows={6} className={`${inputCls} leading-relaxed resize-y`} />
                                    </label>
                                    <InlineError message={postError} />
                                    <div className="grid grid-cols-2 gap-3">
                                        <button type="button" onClick={() => { setPostEditing(false); setPostError(''); }} disabled={postSaving} className={btnCancelWhite}><XMarkIcon size={16} />取消</button>
                                        <button type="button" onClick={savePost} disabled={postSaving || !postDraft.trim()} className={btnSubmitDark}><CheckIcon size={16} />{postSaving ? '儲存中…' : '儲存'}</button>
                                    </div>
                                </div>
                            ) : (
                                <p style={fsStyle} className="text-zinc-700 whitespace-pre-line break-words">{post.content ?? post.summary ?? ''}</p>
                            )}
                            {postConfirmDel && (
                                <ConfirmModal title="刪除貼文？" confirmLabel="刪除" busy={postDeleting} error={postError}
                                    onCancel={() => { setPostConfirmDel(false); setPostError(''); }} onConfirm={deletePost} />
                            )}
                            <div className="flex flex-wrap items-center gap-x-5 gap-y-2 mt-3 text-zinc-500">
                                {isPublicView
                                    ? <PrayButton postId={post.id} count={Number(post.response_count) || 0} responded={!!post.has_responded} onResponded={() => {}} onError={setError} />
                                    : null}
                                <span className="inline-flex items-center gap-1.5 text-sm tabular-nums shrink-0">
                                    <ClockIcon size={18} /><span className="sr-only">時間：</span>{formatAgo(post.created_at)}
                                </span>
                            </div>
                        </div>

                        {/* 所有留言：權限圖示＋姓名，下方是內容，之間用灰線分隔 */}
                        {state.status === 'loading' && <div className="p-4 sm:p-5 text-sm text-zinc-400">讀取留言中</div>}
                        {state.status === 'error' && <div className="p-4 sm:p-5 text-sm text-zinc-500">暫時無法讀取留言</div>}
                        {state.items.map(u => (
                            <ReplyItem key={u.id} u={u} onSaved={(rid, content) => setState(st => ({ ...st, items: st.items.map(x => x.id === rid ? { ...x, content } : x) }))}
                                onDeleted={(rid) => setState(st => { const items = st.items.filter(x => x.id !== rid); updateCounts.cache[id] = items.length; return { ...st, items }; })} />
                        ))}

                        {/* 輸入框：只有貼文者與審查權限者看得到；版面同發表貼文 */}
                        {state.canReply && (
                            <form onSubmit={(e) => { e.preventDefault(); send(); }} className="p-4 sm:p-5 flex flex-col gap-4">
                                <label className="flex flex-col gap-1.5">
                                    <span className="flex justify-between text-sm font-medium text-zinc-700">你想說什麼 <span className="text-xs tabular-nums text-zinc-400">{text.length}/500</span></span>
                                    <textarea value={text} onChange={(e) => setText(e.target.value)} maxLength={500} rows={5} placeholder="新增回覆" className={`${inputCls} leading-relaxed resize-y`} />
                                </label>
                                <InlineError message={error} />
                                <div className="grid grid-cols-2 gap-3">
                                    <button type="button" onClick={() => { setText(''); setError(''); }} disabled={busy} className={btnCancelWhite}><XMarkIcon size={16} />清除內容</button>
                                    <button type="submit" disabled={busy || !text.trim()} className={btnSubmitDark}><SendIcon size={16} />{busy ? '送出中…' : '送出'}</button>
                                </div>
                            </form>
                        )}
                    </div>
                </PageShell>
            );
        };

        // 同一時間只能開一個編輯視窗：這個編輯打開時，會自動關掉另一個正在編輯的（貼文、回覆都算）
        const editLock = { cur: null };
        const useExclusiveEdit = (editing, close) => {
            const id = useRef({}).current;
            const closeRef = useRef(close);
            closeRef.current = close;
            useEffect(() => {
                if (editing) {
                    const prev = editLock.cur;
                    if (prev && prev.id !== id) prev.close();
                    editLock.cur = { id, close: () => closeRef.current() };
                }
                return () => { if (editLock.cur && editLock.cur.id === id) editLock.cur = null; };
            }, [editing]);
        };

        // 貼文右上角的「三個點」選單：審查者才看得到，選項是編輯、刪除
        const PostMenu = ({ onEdit, onDelete }) => {
            const [open, setOpen] = useState(false);
            const boxRef = useRef(null);
            useEffect(() => {
                if (!open) return;
                const onDown = (e) => { if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false); };
                const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
                document.addEventListener('mousedown', onDown);
                document.addEventListener('touchstart', onDown);
                window.addEventListener('keydown', onKey);
                return () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('touchstart', onDown); window.removeEventListener('keydown', onKey); };
            }, [open]);
            const itemCls = `w-full flex items-center gap-2.5 px-4 py-2.5 text-sm font-medium text-left hover:bg-zinc-50 active:bg-zinc-100 transition-colors duration-150 ${focusRing}`;
            return (
                <div ref={boxRef} className="relative shrink-0">
                    <button type="button" onClick={() => setOpen(v => !v)} aria-haspopup="menu" aria-expanded={open} aria-label="更多" title="更多"
                        className={`p-2 -m-2 rounded-full text-zinc-400 hover:text-zinc-700 transition-colors duration-150 ${focusRing}`}><EllipsisIcon size={20} /></button>
                    {open && (
                        <div role="menu" className="absolute right-0 top-full mt-3 z-20 min-w-[8rem] bg-white rounded-lg border border-zinc-200 shadow-lg py-1 overflow-hidden">
                            <button type="button" role="menuitem" onClick={() => { setOpen(false); onEdit(); }} className={`${itemCls} text-zinc-700`}><PencilIcon size={16} />編輯</button>
                            <button type="button" role="menuitem" onClick={() => { setOpen(false); onDelete(); }} className={`${itemCls} text-red-600`}><TrashIcon size={16} />刪除</button>
                        </div>
                    )}
                </div>
            );
        };

        const PostCard = ({ p, onResponded, onDeleted }) => {
            const [error, setError] = useState('');
            const [edited, setEdited] = useState(null);       // 審查者編輯後的內容（先顯示在這張卡片上）
            const [editing, setEditing] = useState(false);
            const [draft, setDraft] = useState('');
            const [saving, setSaving] = useState(false);
            const [confirmDel, setConfirmDel] = useState(false);
            const [deleting, setDeleting] = useState(false);
            const [menuError, setMenuError] = useState('');
            const isReviewer = viewerState.isReviewer;
            useExclusiveEdit(editing, () => { setEditing(false); setMenuError(''); });
            const saveEdit = async () => {
                const content = draft.trim();
                if (!content) { setMenuError('內容不可空白'); return; }
                if (content === (edited ?? p.content ?? p.summary ?? '')) { setEditing(false); return; }
                setSaving(true); setMenuError('');
                try { await api.editContent(p.id, content); setEdited(content); setEditing(false); }
                catch (err) { setMenuError(err.message || '儲存失敗，稍後再試'); }
                setSaving(false);
            };
            const doDelete = async () => {
                setDeleting(true); setMenuError('');
                try { await api.deletePost(p.id); setConfirmDel(false); if (onDeleted) onDeleted(p.id); }
                catch (err) { setMenuError(err.message || '刪除失敗，稍後再試'); }
                setDeleting(false);
            };
            const text = edited ?? p.content ?? p.summary ?? '';
            const name = !p.display_name || p.display_name === '匿名' ? ANON_NAME : p.display_name;
            return (
                <li className="bg-white rounded-lg border border-zinc-200 shadow-sm p-4 sm:p-5">
                    <div className="flex items-center justify-between gap-3 mb-2.5">
                        <div className="flex items-center gap-3 min-w-0">
                            <CategoryAvatar id={p.category} />
                            <span className="text-[15px] font-medium text-zinc-900 truncate min-w-0">{name}</span>
                        </div>
                        {isReviewer && <PostMenu onEdit={() => { setDraft(text); setMenuError(''); setEditing(true); }} onDelete={() => { setMenuError(''); setConfirmDel(true); }} />}
                    </div>

                    {editing ? (
                        <div className="flex flex-col gap-3">
                            <label className="flex flex-col gap-1.5">
                                <span className="flex justify-between text-sm font-medium text-zinc-700">內容 <span className="text-xs tabular-nums text-zinc-400">{draft.length}/800</span></span>
                                <textarea value={draft} onChange={(e) => setDraft(e.target.value)} maxLength={800} rows={6} className={`${inputCls} leading-relaxed resize-y`} />
                            </label>
                            <InlineError message={menuError} />
                            <div className="grid grid-cols-2 gap-3">
                                <button type="button" onClick={() => { setEditing(false); setMenuError(''); }} disabled={saving} className={btnCancelWhite}><XMarkIcon size={16} />取消</button>
                                <button type="button" onClick={saveEdit} disabled={saving || !draft.trim()} className={btnSubmitDark}><CheckIcon size={16} />{saving ? '儲存中…' : '儲存'}</button>
                            </div>
                        </div>
                    ) : <ClampText text={text} />}

                    <div className="flex flex-wrap items-center gap-x-5 gap-y-2 mt-3 text-zinc-500">
                        <PrayButton postId={p.id} count={Number(p.response_count) || 0} responded={!!p.has_responded} onResponded={onResponded} onError={setError} />
                        <UpdatesButton postId={p.id} onClick={() => go(`#/post/${p.id}`)} />
                        <span className="inline-flex items-center gap-1.5 text-sm tabular-nums shrink-0">
                            <ClockIcon size={18} /><span className="sr-only">時間：</span>{formatAgo(p.created_at)}
                        </span>
                    </div>
                    {error && <div className="mt-2"><InlineError message={error} /></div>}
                    {confirmDel && (
                        <ConfirmModal title="刪除貼文？" confirmLabel="刪除" busy={deleting} error={menuError}
                            onCancel={() => { setConfirmDel(false); setMenuError(''); }} onConfirm={doDelete} />
                    )}
                </li>
            );
        };

        // 文字大小切換：三個大小不同的「A」，選擇會記在這個瀏覽器
        const FONT_SIZES = [
            { id: 'sm', px: 13, btn: 9, label: '小字' },
            { id: 'md', px: 15, btn: 13, label: '標準字' },
            { id: 'lg', px: 18, btn: 18, label: '大字' },
        ];
        const FONT_KEY = 'tbc_prayer_fontsize';
        const applyFontSize = (id) => {
            const f = FONT_SIZES.find(x => x.id === id) || FONT_SIZES[1];
            document.documentElement.style.setProperty('--post-fs', f.px + 'px');
            window.dispatchEvent(new Event('tbc-fontsize'));
        };
        const loadFontSize = () => { try { return localStorage.getItem(FONT_KEY) || 'md'; } catch (e) { return 'md'; } };
        // 一開啟頁面就套用上次選的大小
        try { document.documentElement.style.setProperty('--post-fs', (FONT_SIZES.find(x => x.id === loadFontSize()) || FONT_SIZES[1]).px + 'px'); } catch (e) {}

        const FontSizeSwitch = () => {
            const [size, setSize] = useState(loadFontSize);
            const pick = (id) => {
                setSize(id);
                try { localStorage.setItem(FONT_KEY, id); } catch (e) {}
                applyFontSize(id);
            };
            return (
                <div className="grid grid-cols-3 gap-1.5 w-36 shrink-0" role="group" aria-label="文字大小">
                    {FONT_SIZES.map(f => {
                        const active = size === f.id;
                        return (
                            <button key={f.id} type="button" onClick={() => pick(f.id)} aria-pressed={active} aria-label={f.label} title={f.label}
                                className={`w-full h-10 rounded-lg inline-flex items-center justify-center font-medium transition-colors duration-150 active:scale-[0.98] ${focusRing} ${active ? 'bg-zinc-900 text-white' : 'bg-zinc-100 text-zinc-800 hover:bg-zinc-200'}`}
                                style={{ fontSize: f.btn }}>A</button>
                        );
                    })}
                </div>
            );
        };

        // 目前登入者：權限圖示＋姓名（未登入顯示「訪客」）
        // 權限代號、名稱、圖示與 MemberDataCenter 相同（領袖、牧師、管理員的圖示用琥珀色標出來）
        const ROLE_INFO = {
            member:      { icon: UserIcon,        label: '會友' },
            coworker:    { icon: UserCheckIcon,   label: '同工' },
            admin_staff: { icon: FolderOpenIcon,  label: '行政' },
            leader:      { icon: StarIcon,        label: '領袖', high: true },
            pastor:      { icon: GraduationCapIcon, label: '牧師', high: true },
            admin:       { icon: ShieldIcon,      label: '管理員', high: true },
        };
        const roleInfoOf = (role) => ROLE_INFO[role === 'user' ? 'member' : role] || (role ? { icon: UserIcon, label: String(role) } : ROLE_INFO.member);
        const UserBadge = ({ loggedIn, role, name }) => {
            const [showRole, setShowRole] = useState(false);
            // 點圖示：姓名換成權限文字；再點一次換回來，3 秒後也會自己換回來
            useEffect(() => {
                if (!showRole) return;
                const t = setTimeout(() => setShowRole(false), 3000);
                return () => clearTimeout(t);
            }, [showRole]);
            const info = loggedIn ? roleInfoOf(role) : { icon: UserIcon, label: '訪客' };
            const I = info.icon;
            const shown = loggedIn ? (name || '會員') : '訪客';
            return (
                <div className="flex items-center gap-2.5 min-w-0 text-zinc-700">
                    <button type="button" onClick={() => setShowRole(v => !v)} aria-pressed={showRole} aria-label={`權限：${info.label}，點一下切換顯示`} title="點一下看權限"
                        className={`w-10 h-10 shrink-0 rounded-full bg-zinc-100 hover:bg-zinc-200 active:bg-zinc-300 ${info.high ? 'text-amber-500' : 'text-zinc-500'} flex items-center justify-center transition-colors duration-150 ${focusRing}`}>
                        <I size={20} />
                    </button>
                    <span className="text-[15px] font-medium text-zinc-900 truncate min-w-0" aria-live="polite">{showRole ? info.label : shown}</span>
                </div>
            );
        };

        // ==========================================
        // 首頁：最新禱告（像 Facebook 動態）
        // ==========================================
        const HomeView = ({ goSubmit, session, role, memberName }) => {
            const [results, setResults] = useState([]);
            const [status, setStatus] = useState('loading');
            const lastLoad = useRef(Date.now());

            // silent = true：背景更新，不顯示載入中的骨架畫面
            const load = useCallback(async (silent) => {
                if (silent !== true) setStatus('loading');
                try { setResults(await api.search('', 'all')); setStatus('ok'); lastLoad.current = Date.now(); }
                catch (err) { console.error('讀取失敗:', err); if (silent !== true) setStatus('error'); }
            }, []);
            useEffect(() => { load(); }, [load]);
            // 回到這個分頁時，如果超過 1 分鐘沒更新，就在背景更新最新貼文與次數
            useEffect(() => {
                const onVisible = () => { if (document.visibilityState === 'visible' && Date.now() - lastLoad.current > 60000) load(true); };
                document.addEventListener('visibilitychange', onVisible);
                return () => document.removeEventListener('visibilitychange', onVisible);
            }, [load]);

            const patch = (id, n) => setResults(list => list.map(x => x.id === id ? { ...x, response_count: n, has_responded: true } : x));

            return (
                <main className="max-w-2xl mx-auto w-full px-4 sm:px-6 pt-6 pb-20 animate-fade-in">
                    <div className="flex items-center justify-between gap-3 mb-4">
                        <UserBadge loggedIn={!!session} role={role} name={memberName} />
                        <FontSizeSwitch />
                    </div>
                    <h2 className="text-[clamp(1.0625rem,5.4vw,1.5rem)] font-semibold text-zinc-900 leading-snug mb-5 break-words">今天，神感動你要為什麼禱告？</h2>
                    <section aria-live="polite">
                        {status === 'loading' && <Skeletons />}
                        {status === 'error' && <ErrorBox message="暫時無法載入，稍後再試" onRetry={() => load()} />}
                        {status === 'ok' && results.length === 0 && <EmptyBox message="讓我們一起守望禱告" action={<button onClick={goSubmit} className={btnDark}>新增貼文</button>} />}
                        {status === 'ok' && results.length > 0 && (
                            <ul className="flex flex-col gap-3">
                                {results.map(p => <PostCard key={p.id} p={p} onResponded={(n) => patch(p.id, n)} onDeleted={(id) => setResults(l => l.filter(x => x.id !== id))} />)}
                            </ul>
                        )}
                        {status === 'ok' && results.length >= 50 && <p className="text-center text-sm text-zinc-400 mt-6">顯示最新 50 則，更多請用搜尋</p>}
                    </section>
                </main>
            );
        };

        // ==========================================
        // 搜尋頁：輸入關鍵字即時搜尋；右側篩選鈕可選分類；沒輸入時顯示「最新」搜尋紀錄與分類
        // 搜尋紀錄只存在這個瀏覽器（localStorage），不會上傳。
        // ==========================================
        const RECENT_KEY = 'tbc_prayer_recent';
        const loadRecent = () => {
            try {
                const a = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
                return Array.isArray(a) ? a.filter(x => typeof x === 'string').slice(0, 10) : [];
            } catch (e) { return []; }
        };
        const saveRecent = (arr) => { try { localStorage.setItem(RECENT_KEY, JSON.stringify(arr)); } catch (e) { /* 無法儲存就略過 */ } };

        const chipCls = (active) => `px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-colors duration-150 active:scale-[0.98] ${focusRing} ${active ? 'bg-zinc-900 text-white' : 'bg-zinc-100 text-zinc-800 hover:bg-zinc-200'}`;

        // 搜尋條件記在這裡：點進貼文再返回時，回到原本的關鍵字與結果；從搜尋圖示重新進入則清空
        let searchMemory = null;
        const openSearch = () => { searchMemory = null; go('#/search'); };
        const SearchView = ({ goHome }) => {
            const mem = searchMemory || {};
            const [draft, setDraft] = useState(mem.draft || '');
            const [category, setCategory] = useState(mem.category || 'all');
            const [showFilter, setShowFilter] = useState(!!mem.showFilter);
            const [recent, setRecent] = useState(loadRecent);
            const [editing, setEditing] = useState(false);
            const [results, setResults] = useState([]);
            const [status, setStatus] = useState('idle');
            const reqId = useRef(0);
            const [dateFrom, setDateFrom] = useState(mem.dateFrom || '');
            const [dateTo, setDateTo] = useState(mem.dateTo || '');
            const [showAll, setShowAll] = useState(!!mem.showAll);   // 按下「全部」：直接列出所有貼文
            useEffect(() => { searchMemory = { draft, category, showFilter, dateFrom, dateTo, showAll }; }, [draft, category, showFilter, dateFrom, dateTo, showAll]);
            const keyword = draft.trim();
            const rangeBad = dateFrom !== '' && dateTo !== '' && dateFrom > dateTo;
            const active = keyword !== '' || category !== 'all' || dateFrom !== '' || dateTo !== '' || showAll;

            const run = useCallback(async (kw, cat, from, to) => {
                const mine = ++reqId.current;
                setStatus(s => s === 'ok' ? s : 'loading');   // 已有結果時不閃骨架畫面，直接換內容
                try {
                    const r = await api.search(kw, cat, from, to);
                    if (reqId.current === mine) { setResults(r); setStatus('ok'); }
                } catch (err) {
                    console.error('搜尋失敗:', err);
                    if (reqId.current === mine) setStatus('error');
                }
            }, []);

            useEffect(() => {
                if (!active || rangeBad) { reqId.current++; setStatus('idle'); setResults([]); return; }
                const t = setTimeout(() => run(keyword, category, dateFrom, dateTo), 350);
                return () => clearTimeout(t);
            }, [keyword, category, dateFrom, dateTo, active, rangeBad, run]);

            const remember = (kw) => {
                if (!kw) return;
                const next = [kw, ...recent.filter(x => x !== kw)].slice(0, 10);
                setRecent(next); saveRecent(next);
            };
            const submit = (e) => { e.preventDefault(); remember(keyword); };
            const removeRecent = (kw) => { const next = recent.filter(x => x !== kw); setRecent(next); saveRecent(next); if (next.length === 0) setEditing(false); };
            const clearRecent = () => { setRecent([]); saveRecent([]); setEditing(false); };
            const patch = (id, n) => setResults(list => list.map(x => x.id === id ? { ...x, response_count: n, has_responded: true } : x));

            return (
                <main className="max-w-2xl mx-auto w-full px-4 sm:px-6 pt-3 pb-20 animate-fade-in">
                    <form onSubmit={submit} role="search" className="flex items-center gap-2">
                        <button type="button" onClick={goHome} aria-label="返回" className={`p-2 -ml-2 rounded-full text-zinc-800 hover:bg-zinc-100 active:bg-zinc-200 transition-colors duration-150 ${focusRing}`}><ArrowLeft size={24} /></button>
                        <div className="relative flex-1">
                            <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-400 pointer-events-none"><SearchIcon size={20} /></span>
                            <input type="search" value={draft} onChange={(e) => setDraft(e.target.value)} maxLength={100} autoFocus enterKeyHint="search" placeholder="搜尋" aria-label="搜尋關鍵字"
                                className="w-full bg-zinc-100 rounded-full pl-11 pr-12 py-3 text-zinc-900 font-medium placeholder:text-zinc-400 hover:bg-zinc-200/70 focus:outline-none focus:ring-2 focus:ring-emerald-600/30 transition-colors duration-150" />
                            <button type="button" onClick={() => setShowFilter(s => !s)} aria-label="篩選分類" aria-expanded={showFilter}
                                className={`absolute right-1.5 top-1/2 -translate-y-1/2 p-2 rounded-full transition-colors duration-150 ${focusRing} ${showFilter || category !== 'all' ? 'text-zinc-900' : 'text-zinc-500 hover:text-zinc-900'}`}>
                                <SlidersIcon size={20} />
                                {category !== 'all' && <span className="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-emerald-600" aria-hidden="true"></span>}
                            </button>
                        </div>
                    </form>

                    <DateRange from={dateFrom} to={dateTo} onFrom={setDateFrom} onTo={setDateTo} className="mt-4" />
                    {rangeBad && <div className="mt-3"><InlineError message="開始日期不可晚於結束日期" /></div>}

                    {showFilter && (
                        <div className="flex overflow-x-auto no-scrollbar gap-2 mt-4" role="group" aria-label="分類">
                            {CATEGORIES.map(c => (
                                <button key={c.id} type="button" onClick={() => { setCategory(c.id); setShowAll(c.id === 'all'); }} aria-pressed={category === c.id} className={chipCls(category === c.id)}>{c.label}</button>
                            ))}
                        </div>
                    )}

                    {!active && (
                        <div className="mt-8 flex flex-col gap-8">
                            {recent.length > 0 && (
                                <section aria-labelledby="recent-title">
                                    <div className="flex items-center justify-between mb-3">
                                        <h2 id="recent-title" className="text-lg font-semibold text-zinc-900">最新</h2>
                                        <div className="flex items-center gap-3">
                                            {editing && <button type="button" onClick={clearRecent} className={`text-sm font-medium text-red-600 hover:text-red-700 rounded ${focusRing}`}>全部清除</button>}
                                            <button type="button" onClick={() => setEditing(e => !e)} className={`text-sm font-medium text-zinc-500 hover:text-zinc-900 rounded ${focusRing}`}>{editing ? '完成' : '編輯'}</button>
                                        </div>
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        {recent.map(kw => (
                                            <span key={kw} className="inline-flex items-center">
                                                <button type="button" onClick={() => { if (!editing) setDraft(kw); }} className={`${chipCls(false)} ${editing ? 'rounded-r-none pr-3' : ''}`}>{kw}</button>
                                                {editing && <button type="button" onClick={() => removeRecent(kw)} aria-label={`刪除搜尋紀錄 ${kw}`} className={`px-2.5 py-2 rounded-r-full bg-zinc-100 text-zinc-500 hover:bg-zinc-200 hover:text-zinc-900 transition-colors duration-150 ${focusRing}`}><XIcon size={16} /></button>}
                                            </span>
                                        ))}
                                    </div>
                                </section>
                            )}
                            <section aria-labelledby="cat-title">
                                <h2 id="cat-title" className="text-lg font-semibold text-zinc-900 mb-3">分類</h2>
                                <div className="flex flex-wrap gap-2">
                                    {SUBMIT_CATEGORIES.map(c => <button key={c.id} type="button" onClick={() => setCategory(c.id)} className={chipCls(false)}>{c.label}</button>)}
                                </div>
                            </section>
                        </div>
                    )}

                    {active && (
                        <section className="mt-6" aria-live="polite">
                            {status === 'loading' && <Skeletons />}
                            {status === 'error' && <ErrorBox message="暫時無法搜尋，請稍後再試" onRetry={() => run(keyword, category)} />}
                            {status === 'ok' && results.length === 0 && <EmptyBox message="找不到，換個關鍵字試試" />}
                            {status === 'ok' && results.length > 0 && (
                                <ul className="flex flex-col gap-3">
                                    {results.map(p => <PostCard key={p.id} p={p} onResponded={(n) => patch(p.id, n)} onDeleted={(id) => setResults(l => l.filter(x => x.id !== id))} />)}
                                </ul>
                            )}
                        </section>
                    )}
                </main>
            );
        };

        // ==========================================
        // 提報／修改表單（提報與「被退回後修改」共用）
        // ==========================================
        const RadioCard = ({ checked, onChange, title, hint, name }) => (
            <label className={`flex-1 flex items-start gap-3 p-4 rounded-lg border cursor-pointer transition-colors duration-150 focus-within:ring-2 focus-within:ring-emerald-600 focus-within:ring-offset-2 ${checked ? 'border-zinc-900 bg-zinc-50' : 'border-zinc-200 bg-white hover:bg-zinc-50'}`}>
                <input type="radio" name={name} checked={checked} onChange={onChange} className="mt-1 accent-zinc-900" />
                <span className="flex flex-col"><span className="text-sm font-medium text-zinc-900">{title}</span><span className="text-xs text-zinc-500 mt-0.5">{hint}</span></span>
            </label>
        );

        const PostForm = ({ initial, submitLabel, busy, error, onSubmit, onCancel, draftKey }) => {
            const [v, setV] = useState(initial);
            // 草稿：打字時自動存在這個瀏覽器，不小心離開或重新整理也不會丟字（送出成功後才清掉）
            useEffect(() => {
                if (!draftKey) return;
                const t = setTimeout(() => { try { localStorage.setItem(draftKey, JSON.stringify(v)); } catch (e) { /* 無法儲存就略過 */ } }, 500);
                return () => clearTimeout(t);
            }, [v, draftKey]);
            const set = (k, val) => setV(s => ({ ...s, [k]: val }));
            const submit = (e) => { e.preventDefault(); const content = v.content.trim(); onSubmit({ ...v, content }); };
            const ready = v.content.trim() && v.category;

            return (
                <form onSubmit={submit} className="bg-white border border-zinc-200 rounded-lg p-5 sm:p-8 shadow-sm flex flex-col gap-6">
                    <label className="flex flex-col gap-1.5">
                        <span className="flex justify-between text-sm font-medium text-zinc-700">你想說什麼 <span className="text-xs tabular-nums text-zinc-400">{v.content.length}/800</span></span>
                        <textarea value={v.content} onChange={(e) => set('content', e.target.value)} maxLength={800} rows={7} required className={`${inputCls} leading-relaxed resize-y`} />
                    </label>

                    <fieldset className="flex flex-col gap-2">
                        <legend className="text-sm font-medium text-zinc-700 mb-1">分類</legend>
                        <div className="flex flex-wrap gap-2">
                            {SUBMIT_CATEGORIES.map(c => {
                                const active = v.category === c.id;
                                return (
                                    <button key={c.id} type="button" aria-pressed={active} onClick={() => set('category', c.id)}
                                        className={`px-4 py-2 rounded-full text-sm font-medium border transition-colors duration-150 active:scale-[0.98] ${focusRing} ${active ? 'bg-zinc-900 border-zinc-900 text-white' : 'bg-white border-zinc-200 text-zinc-600 hover:bg-zinc-50 hover:border-zinc-300'}`}>{c.label}</button>
                                );
                            })}
                        </div>
                    </fieldset>

                    <fieldset className="flex flex-col gap-2">
                        <legend className="text-sm font-medium text-zinc-700 mb-1">誰可以看到貼文</legend>
                        <div className="flex flex-col sm:flex-row gap-3">
                            <RadioCard name="is_public" checked={v.is_public === true} onChange={() => set('is_public', true)} title="公開" hint="所有人都能查閱、搜尋" />
                            <RadioCard name="is_public" checked={v.is_public === false} onChange={() => set('is_public', false)} title="不公開" hint="只有牧者、區長與你本人看得到" />
                        </div>
                    </fieldset>

                    <fieldset className="flex flex-col gap-2">
                        <legend className="text-sm font-medium text-zinc-700 mb-1">隱私設定</legend>
