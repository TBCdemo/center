<!DOCTYPE html>
<!-- TBC ONE TBC Together — 由原始碼打包（src/center/index），勿手動修改 -->
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TBC Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="../management/tbc-config.js"></script>
<style>
  /* TBC 會友端共用樣式：色彩、深色模式、字體大小、基本重設（全站只有這一份，改這裡所有會友端頁面一起更新） */
  :root{
  --btn:#334155; --btn-hover:#1e293b; --btn-press:#0f172a; --on-btn:#ffffff;
 --bg:#ffffff; --card:#f7f9fa; --text:#262626; --sub:#595959; --mute:#8c8c8c; --border:#e8e8e8;
         --primary:#8806ce; --primary-hover:#7205ad; --primary-tint:#f7eefc; --primary-ink:#5c048c;
         --good:#8806ce; --adhoc:#f5f5f0; --busy:#c9c9c9; --bad:#d4380d; --bad-bg:#fff1f0; --green:#1f7a45; --green-bg:#e8f6ee; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
  --btn:#f1f5f9; --btn-hover:#e2e8f0; --btn-press:#cbd5e1; --on-btn:#0b1120;
 --bg:#0b1120; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --mute:#64748b; --border:#334155;
      --adhoc:#33361a; --busy:#475569; --primary-tint:#3a1a4d; --primary-ink:#e6c9f6; --good:#d9afef; --bad:#ff7a45; --bad-bg:#3a1d17; --green:#6fd09a; --green-bg:#14301f; }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ background:var(--bg); color:var(--text); font-family:'Open Sans','Noto Sans TC',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        font-size:var(--fs,15px); letter-spacing:0; -webkit-tap-highlight-color:transparent;
        padding-bottom:env(safe-area-inset-bottom,0px); }
  button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }
  input,select,textarea{ font:inherit; font-size:16px; color:var(--text); }
  svg{ display:block; flex:none; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  :root{ --fs:15px; --hov:#f4f4f5; --hov-soft:#fafafa; --menu-ink:#52525b; --menu-ink-hi:#18181b; --menu-line:#f4f4f5; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --btn:#f1f5f9; --btn-hover:#e2e8f0; --btn-press:#cbd5e1; --on-btn:#0b1120;
 --hov:#334155; --hov-soft:#273449; --menu-ink:#94a3b8; --menu-ink-hi:#f1f5f9; --menu-line:#334155; } }


  /* ===== 首頁版面（原本用 Tailwind 即時編譯，現在改成一般樣式；尺寸與舊版一致）===== */
  :root[data-theme="dark"]{
  --btn:#f1f5f9; --btn-hover:#e2e8f0; --btn-press:#cbd5e1; --on-btn:#0b1120;
  --bg:#0b1120; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --border:#334155; --primary-tint:#3a1a4d; --primary-ink:#e6c9f6; }
  html{ line-height:1.5; -webkit-text-size-adjust:100%; }
  html,body{ height:100%; }
  h1,h2,p{ margin:0; }
  h1,h2{ font-size:inherit; font-weight:inherit; }
  a{ color:inherit; text-decoration:none; }
  .hidden{ display:none !important; }
  body{
    min-height:100dvh; display:flex; flex-direction:column; align-items:center;
    padding:40px 24px 40px; font-weight:400; letter-spacing:0;
  }
  @media (min-width:640px){ body{ padding-top:80px; } }
  main{ width:100%; max-width:48rem; }
  .sub{ color:var(--sub); }
  /* 只有英文與數字才縮字距（DESIGN.md 的 -0.03em），中文不套用 */
  .latin-tight{ letter-spacing:-0.03em; }

  /* 標題與標語 */
  .hero{ text-align:center; margin-bottom:3rem; }
  .brand{ display:inline-block; max-width:100%; }
  .brand h1{ font-size:2.25rem; font-weight:700; line-height:1.08; }
  @media (min-width:640px){ .brand h1{ font-size:3rem; } }
  .tagline{ width:0; min-width:100%; white-space:nowrap; font-size:.9375rem; text-align:center; letter-spacing:0; margin-top:.75rem; font-weight:400; }
  @media (min-width:640px){ .tagline{ font-size:1.0625rem; } }

  /* 按鈕：全部是膠囊形。主要＝深色實心，不加陰影 */
  .btn-pill{ display:inline-flex; align-items:center; justify-content:center; gap:.25rem; height:40px; padding:0 16px; border-radius:9999px; font-size:.875rem; font-weight:400; letter-spacing:0; transition:background-color .15s ease; }
  .btn-primary{ background:var(--btn); color:var(--on-btn); }
  .btn-primary:hover{ background:var(--btn-hover); }
  .btn-primary:active{ background:var(--btn-press); }
  .btn-pill:focus-visible{ outline:2px solid var(--primary); outline-offset:3px; }

  /* 入口圖示：每排三個；新增頁面時由登記表（src/center/registry.js）自動長出來，超過三個會自動換排 */
  .entries{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); column-gap:.5rem; row-gap:1.25rem; max-width:24rem; margin-left:auto; margin-right:auto; }
  @media (min-width:640px){ .entries{ column-gap:1.5rem; max-width:28rem; } }
  .entry{ display:flex; flex-direction:column; align-items:center; gap:.5rem; min-width:0; }
  .entry-icon{ width:2.25rem; height:2.25rem; color:#8806ce; transition:transform .2s ease; }
  @media (min-width:640px){ .entry-icon{ width:2.5rem; height:2.5rem; } }
  .entry-name{ font-size:.875rem; line-height:1.25rem; font-weight:500; text-align:center; white-space:nowrap; }
  @media (min-width:640px){ .entry-name{ font-size:1rem; line-height:1.5rem; } }
  .entry:hover .entry-icon, .entry:focus-visible .entry-icon{ transform:translateY(-3px); }
  .entry:active .entry-icon{ transform:scale(.92); }
  .entry:focus-visible{ outline:2px solid #8806ce; outline-offset:4px; border-radius:.75rem; }
  @media (prefers-reduced-motion: reduce){ .entry-icon{ transition:none; } }

  /* 入口圖示右上角的紅色數字 */
  .entry-ico{ position:relative; display:inline-flex; }
  .entry-badge{ position:absolute; top:-6px; right:-10px; min-width:18px; height:18px; padding:0 5px; border-radius:9999px; background:#d4101b; color:#fff; font-size:11px; font-weight:600; line-height:18px; text-align:center; font-variant-numeric:tabular-nums; box-shadow:0 0 0 2px var(--bg); }
  .entry-badge[hidden]{ display:none; }

  /* 服事提醒卡片（在入口圖示下方） */
  .reminder{ max-width:24rem; margin:1.25rem auto 0; }
  @media (min-width:640px){ .reminder{ max-width:28rem; } }
  .reminder[hidden]{ display:none; }
  .reminder-card{ display:flex; align-items:center; gap:1rem; padding:.875rem 1.125rem; background:var(--bg); border:1px solid var(--border); border-radius:1rem; transition:background-color .15s ease; }
  .reminder-card:hover{ background:var(--hov-soft,#fafafa); }
  .reminder-card:focus-visible{ outline:2px solid var(--primary); outline-offset:3px; }
  .reminder-date{ flex:none; width:4.5rem; height:4.5rem; border-radius:.875rem; background:var(--hov,#f4f4f5); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.25; }
  .rd-m, .rd-w{ font-size:.8125rem; color:var(--text); }
  .rd-d{ font-size:1.75rem; font-weight:500; line-height:1.15; font-variant-numeric:tabular-nums; }
  .reminder-bd{ min-width:0; font-size:1rem; line-height:1.5rem; font-weight:400; color:var(--text); }

  /* ===== 守望花園 ===== */
  .login-area{ text-align:center; }
  .login-hint{ margin-top:1rem; font-size:1rem; line-height:1.5rem; }
  .login-note{ font-size:.875rem; line-height:1.25rem; margin-top:.25rem; }
  .login-hint a{ cursor:pointer; color:var(--primary); font-weight:500; text-decoration:underline; text-underline-offset:3px; }
  .login-hint a:hover{ color:var(--primary-hover); }
  .login-hint a:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; border-radius:2px; }
  #garden{ margin-top:1.5rem; }
  @media (min-width:640px){ #garden{ margin-top:2rem; } }
  .garden-head{ text-align:center; }
  .login-hint[hidden], .login-note[hidden]{ display:none; }
  .garden-head p{ margin-top:0; font-size:1rem; line-height:1.5rem; font-weight:400; }
  /* 卡片：8px 圓角、1px 細框、不加陰影（DESIGN.md：Flat + Outlined） */
  .garden-card{ background:var(--card); border:1px solid var(--border); border-radius:8px; box-shadow:none; padding:1.5rem; }
  @media (min-width:640px){ .garden-card{ padding:2rem; } }
  .garden-view{ position:relative; margin-left:auto; margin-right:auto; width:100%; max-width:360px; aspect-ratio:320/206; }
  .garden-glow{ position:absolute; inset:0; border-radius:50%; background:radial-gradient(closest-side, rgba(193,126,230,.28), rgba(193,126,230,.10) 70%, transparent); }
  #plant{ position:relative; width:100%; height:100%; }
  .garden-sum{ margin-top:1rem; text-align:center; }
  .garden-sum .lbl{ font-size:.875rem; line-height:1.25rem; font-weight:400; }
  .garden-num{ margin-top:.25rem; font-weight:400; line-height:1; }
  #garden-total{ font-size:3rem; line-height:1; font-weight:600; font-variant-numeric:tabular-nums; }
  @media (min-width:640px){ #garden-total{ font-size:3.75rem; } }
  .garden-num .unit{ font-size:1.125rem; line-height:1.75rem; font-weight:400; margin-left:.25rem; }
  #garden-stage{ margin-top:.75rem; display:inline-flex; align-items:center; gap:.5rem; font-size:.875rem; line-height:1.25rem; font-weight:500; }
  .stage-pill{ background:var(--primary-tint); color:var(--primary-ink); padding:.25rem .75rem; border-radius:9999px; }
  .garden-bar{ margin:1.25rem auto 0; max-width:28rem; }
  .garden-track{ background:rgba(100,116,139,.20); height:.75rem; border-radius:9999px; overflow:hidden; }
  .garden-fill{ background:var(--primary); height:100%; border-radius:9999px; transition:width .8s ease; }
  .banner-soft{ background:var(--primary-tint); color:var(--primary-ink); margin:1.25rem auto 0; max-width:28rem; text-align:center; font-size:.875rem; line-height:1.25rem; font-weight:500; border-radius:.5rem; padding:.75rem 1rem; }
  #garden-error{ margin-top:1.25rem; text-align:center; }
  #garden-error p{ font-size:.875rem; line-height:1.25rem; font-weight:400; color:#f5222d; }
  #garden-error .btn-pill{ margin-top:.75rem; }
  .garden-cta{ margin-top:1.5rem; text-align:center; }
  /* 擺動：幅度小、速度慢，每一株的幅度、速度、起點都不同，所以不會同步 */
  .sway{ animation:sway 9s ease-in-out infinite alternate; }
  @keyframes sway{ from{ transform:rotate(calc(var(--amp,1deg) * -1)); } to{ transform:rotate(var(--amp,1deg)); } }
  /* 種子外的細環：像呼吸一樣慢慢放大縮小 */
  .seed-ring{ animation:breathe 6s ease-in-out infinite; transform-origin:160px 195px; }
  @keyframes breathe{ 50%{ transform:scale(1.35); } }
  /* 光點：非常緩慢地飄起 */
  .mote{ animation:mote 12s ease-in-out infinite; }
  @keyframes mote{ 0%{ transform:translate(0,8px); opacity:0; } 30%{ opacity:.8; } 70%{ opacity:.6; } 100%{ transform:translate(4px,-26px); opacity:0; } }
  /* 地平線：跟著深淺色模式變色的細線 */
  .g-horizon{ stroke:var(--sub); opacity:.5; }
  /* 深色模式：背景半圓再淡一點，才不會比花還搶眼 */
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .g-suns{ opacity:.55; } }
  :root[data-theme="dark"] .g-suns{ opacity:.55; }
  .garden-skeleton{ animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 50%{ opacity:.45; } }
  @media (prefers-reduced-motion: reduce){
    .sway, .seed-ring, .mote, .garden-skeleton{ animation:none; }
    .garden-fill{ transition:none; }
  }
</style>
</head>
<body>
  <main>

    <div class="hero">
      <!-- 標語寬度要比 TBC Together 窄 -->
      <div class="brand">
        <h1 class="latin-tight">TBC Together</h1>
        <p id="tagline" class="tagline sub">一起禱告、一起服事、一起成長</p>
      </div>
    </div>

    <!-- 入口圖示：由 src/center/registry.js 自動產生（src/center/index/entries.js） -->
    <nav id="entries" class="entries" aria-label="功能入口"></nav>

    <!-- 下週服事提醒：登入且未來 7 天內有服事才會顯示（entries.js） -->
    <div id="reminder" class="reminder" hidden></div>

    <!-- 守望花園：全教會累積的有效禱告回應，決定植物長到哪個階段 -->
    <section id="garden" aria-labelledby="garden-title">
      <div class="garden-head">
        <h2 id="garden-title" class="sr">守望花園</h2>
</div>

      <div class="garden-card">
        <div class="garden-view">
          <div id="garden-glow" class="garden-glow" aria-hidden="true" style="opacity:.3"></div>
          <!-- 花園畫面由 garden.js 依「成長進度」畫出 -->
          <svg id="plant" viewBox="0 0 320 206" role="img" aria-label="守望花園"></svg>
        </div>

        <div class="garden-sum" aria-live="polite">
          <p class="lbl sub">全教會禱告累計</p>
          <p class="garden-num">
            <span id="garden-total" class="latin-tight">—</span>
            <span class="unit sub">次</span>
          </p>
          <p id="garden-stage">
            <span class="stage-pill" id="garden-stage-name">載入中</span>
          </p>
        </div>

        <div class="garden-bar">
          <div class="garden-track" role="progressbar" id="garden-bar" aria-label="花園成長進度" aria-valuemin="0" aria-valuemax="100">
            <div id="garden-fill" class="garden-fill" style="width:0%"></div>
          </div>
        </div>

        <p id="garden-banner" class="banner-soft hidden"></p>

        <div id="garden-error" class="hidden" role="alert">
          <p>暫時無法讀取禱告回應次數，請稍後再試。</p>
          <button id="garden-retry" type="button" class="btn-pill btn-primary">重新載入</button>
        </div>

        <div class="garden-cta">
          <a href="./prayer.html" class="btn-pill btn-primary">一起澆灌禱告的種子</a>
        </div>
      </div>

      <!-- 登入說明：放在灰底卡片下方（entries.js 登入後會隱藏） -->
      <div class="login-area">
        <p class="sub login-hint" id="login-hint"><a href="./manager.html" data-act="login">登入</a>或首次<a href="./manager.html#signup" data-act="signup">設定密碼</a></p>
        <p class="sub login-note" id="login-note">沒有帳號、忘記密碼？請聯絡行政辦公室</p>
      </div>
    </section>
  </main>
