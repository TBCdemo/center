<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TBC Serve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{colors: {
// 主色 #8806CE（覆寫 indigo，全站既有 indigo-* class 自動換色）
indigo: { 50:'#F9F0FD',100:'#F1DEFA',200:'#E2C2F5',300:'#CC9AEC',400:'#B36AE2',500:'#9D32D6',600:'#8806CE',700:'#6F05A8',800:'#590486',900:'#45036A',950:'#2A0240' },
// 輔助綠 #81B776（覆寫 emerald；400 為圖片原色，600 以上供白字/文字使用）
emerald: { 50:'#F0F7EE',100:'#DAEBD6',200:'#B5D7AD',300:'#98C88E',400:'#81B776',500:'#5E9A52',600:'#3F7A34',700:'#325F29',800:'#274A21',900:'#1D3819' },
// 李紫 #DE90DB（取代 sky，用在第三張卡片與漸層終點）
sky: { 50:'#FBF1FA',100:'#F6DFF4',200:'#EDC3EA',300:'#E4A9E0',400:'#DE90DB',500:'#C464C0',600:'#A03F9C',700:'#7E307B' },
// 帶紫調的中性灰
slate: { 50:'#FAF7FD',100:'#F4EFF9',200:'#E8DFF0',300:'#D0C3DC',400:'#9C8CAD',500:'#6F5F82',600:'#54466A',700:'#3F3350',800:'#2A2038',900:'#1A1225' }},}}}
</script>
<style>
  :root{ --bg:#FAF6FE; --card:#ffffff; --text:#1A1225; --sub:#6F5F82; --border:#EBDDF5; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#140B1F; --card:#22132F; --text:#F4ECFA; --sub:#B7A3C8; --border:#3D2557; }
  }
  :root[data-theme="dark"]{ --bg:#140B1F; --card:#22132F; --text:#F4ECFA; --sub:#B7A3C8; --border:#3D2557; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--text);
    font-family:'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .entry-card{ background:var(--card); border-color:var(--border); }
  .sub{ color:var(--sub); }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .text-indigo-600{ color:#C58BEF; }
    :root:not([data-theme="light"]) .text-emerald-600{ color:#81B776; }
    :root:not([data-theme="light"]) .bg-indigo-50{ background:#2A1640; }
    :root:not([data-theme="light"]) .bg-emerald-50{ background:#1A3A14; }
  }
  :root[data-theme="dark"] .text-indigo-600{ color:#C58BEF; }
  :root[data-theme="dark"] .text-emerald-600{ color:#81B776; }
  :root[data-theme="dark"] .bg-indigo-50{ background:#2A1640; }
  :root[data-theme="dark"] .bg-emerald-50{ background:#1A3A14; }
</style>
</head>
<body class="min-h-[100dvh] flex flex-col items-center p-6 pt-10 sm:pt-20 pb-10">
  <main class="w-full max-w-3xl">

    <div class="text-center mb-12">
      <h1 class="text-4xl sm:text-5xl font-black tracking-tight">TBC Serve</h1>
      <p class="mt-3 text-lg font-bold sub">一起服事、一起成長</p>
    </div>

    <div class="grid sm:grid-cols-2 gap-6">

      <a href="./search.html" class="entry-card group block rounded-[2rem] p-8 border shadow-sm hover:shadow-[0_20px_40px_-12px_rgba(136,6,206,.25)] hover:border-indigo-400 hover:-translate-y-1 transition-all duration-300">
        <div class="w-14 h-14 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mb-6">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7">
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </div>
        <h2 class="text-2xl font-black mb-2">我的服事</h2>
        <p class="text-sm font-semibold sub">查詢服事班表</p>
        <div class="mt-6 inline-flex items-center gap-1 text-indigo-600 font-bold text-sm">
          進入查詢系統
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 transition-transform group-hover:translate-x-1">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </div>
      </a>

      <a href="./manager.html" class="entry-card group block rounded-[2rem] p-8 border shadow-sm hover:shadow-[0_20px_40px_-12px_rgba(136,6,206,.25)] hover:border-indigo-400 hover:-translate-y-1 transition-all duration-300">
        <div class="w-14 h-14 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mb-6">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </div>
        <h2 class="text-2xl font-black mb-2">個人設定</h2>
        <p class="text-sm font-semibold sub">設定服事偏好、不可排班日</p>
        <div class="mt-6 inline-flex items-center gap-1 text-emerald-600 font-bold text-sm">
          進入個人資料
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 transition-transform group-hover:translate-x-1">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </div>
      </a>

    </div>
  </main>
</body>
</html>
